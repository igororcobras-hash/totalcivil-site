<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<!-- Acesso: login único da página principal (Firebase) e liberação no painel Usuários do site -->
<script src="/firebase-config.js"></script>
<script src="/acesso-programa.js" data-campo="manutencaoAtivo" data-pedido="manutencaoSolicitado" data-nome="Serviços Públicos" data-voltar="/manutencao/"></script>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Serviços Públicos · Total Civil</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
:root{--bg:#f6f4ee;--grid:#ebe7dc;--card:#fff;--ink:#14182b;--muted:#5a6075;--line:#e4dfd3;--accent:#b8450f;--soft:#fde9de;--ok:#2e7d4f;--warn:#b7791f;--bad:#c0392b;--info:#2563a8;--shadow:0 1px 2px rgba(20,24,43,.06),0 8px 24px rgba(20,24,43,.07);--r:16px}
[data-theme=dark]{--bg:#12141c;--grid:#1a1d28;--card:#1b1f2b;--ink:#eef0f6;--muted:#a3a9bd;--line:#2c3142;--accent:#f08a4b;--soft:#3a2417;--shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;min-height:100vh;font-size:15px;line-height:1.45}
body.noscroll{overflow:hidden}
h1,h2,h3,h4{margin:0 0 6px;line-height:1.2}
h1{font-size:30px;letter-spacing:-.01em}h2{font-size:20px}h3{font-size:17px}
p{margin:6px 0}
.muted{color:var(--muted)}.small{font-size:13px}.sp{flex:1}
.hidden{display:none!important}
.row{display:flex;align-items:center;flex-wrap:wrap}.gap{gap:10px}
.top{position:sticky;top:0;z-index:30;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.top .brand{display:flex;align-items:center;gap:8px;color:var(--ink);text-decoration:none;font-size:17px}
.top .logo{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;font-size:15px}
.top .prog{color:var(--muted);font-weight:600;border-left:1px solid var(--line);padding-left:10px}
.top input.nm{width:150px;margin:0;padding:6px 10px}.top select.pf{width:auto;margin:0;padding:6px 10px}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 60px}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:9px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
[data-theme=dark] .btn.pri{color:#1b0f06}
.btn.dan{color:var(--bad)}.btn.sm{padding:5px 10px;font-size:13px}.btn.mini{padding:2px 8px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:20px}
.pill{display:inline-block;background:var(--soft);color:var(--accent);font-weight:700;font-size:12px;letter-spacing:.04em;text-transform:uppercase;padding:5px 12px;border-radius:999px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;border:1px solid var(--c,#888);color:var(--c,#888);background:color-mix(in srgb,var(--c,#888) 10%,transparent);white-space:nowrap}
.hero{padding:10px 0 18px}.hero p{max-width:760px;color:var(--muted);font-size:16px}
.sec{margin:26px 0 4px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:18px;margin:16px 0}
.ocard{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:24px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:transform .12s,border-color .12s}
.ocard:hover{transform:translateY(-2px);border-color:var(--accent)}
.ocard .ic{width:38px;height:38px;border:2px solid var(--accent);border-radius:8px;display:grid;place-items:center;color:var(--accent);font-size:18px}
.ocard .tp{display:flex;justify-content:space-between;align-items:flex-start}
.ocard h3{margin-top:10px;font-size:19px}
.ocard .ds{color:var(--muted);min-height:44px}
.ocard .pr{font-size:22px;font-weight:800;margin-top:10px}.ocard .pr small{font-size:13px;font-weight:500;color:var(--muted)}
.ocard .ft{display:flex;justify-content:space-between;border-top:1px solid var(--line);padding-top:10px;margin-top:8px;font-size:13px;color:var(--muted)}
.ocard .ft b{color:var(--accent);font-size:15px}
.ocard.add{border-style:dashed;align-items:center;justify-content:center;text-align:center;color:var(--accent);min-height:250px;font-weight:700}
.obrabar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px;margin-bottom:14px}
.obrabar .lbl{font-size:11px;font-weight:800;letter-spacing:.08em;color:var(--accent);margin-right:8px}
.tabs{display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:18px}
.tab{padding:10px 14px;border:0;background:none;font:inherit;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
.tab.on{color:var(--accent);border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}
.kpi .v{font-size:26px;font-weight:800}.kpi .l{font-size:13px;color:var(--muted)}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.efg{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px;margin-top:6px}.efc{display:flex;flex-direction:column;gap:2px;font-size:11px}.efc span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.efc input{padding:5px 6px;text-align:center}.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin-top:10px}
label.chk{display:flex;align-items:center;gap:6px;font-weight:500;margin-top:24px}
input,select,textarea{width:100%;margin-top:4px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--card);color:var(--ink)}
input[type=checkbox],input[type=radio]{width:auto;margin:0}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);border-color:var(--accent)}
fieldset{border:1px solid var(--line);border-radius:14px;margin:0 0 14px;padding:6px 14px 14px}
legend{font-weight:800;padding:0 8px;color:var(--accent)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px}
.item .hd{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.item .num{font-weight:800;color:var(--accent)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.th{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.th img{width:100%;height:105px;object-fit:cover;display:block;background:#8884;cursor:zoom-in}
.th figcaption{padding:6px;display:flex;flex-direction:column;gap:4px}
.th input,.th select{margin:0;padding:4px 6px;font-size:12px}
.mt{display:flex;gap:4px;margin-top:6px}.mt img{width:25%;height:52px;object-fit:cover;border-radius:6px;background:#8884}
.gpsbadge{font-size:11px}.gpsbadge.ok{color:var(--ok)}.gpsbadge.no{color:var(--warn)}
.alert{background:color-mix(in srgb,var(--warn) 14%,transparent);border:1px solid var(--warn);border-radius:10px;padding:8px 12px;margin:10px 0;font-size:14px}
.alert.bad{background:color-mix(in srgb,var(--bad) 12%,transparent);border-color:var(--bad)}
.tablewrap{overflow-x:auto;margin:10px 0}
table.tb{width:100%;border-collapse:collapse;font-size:14px}
table.tb th,table.tb td{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.tb th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
table.tb td.r,table.tb th.r{text-align:right}
table.tb tfoot td{font-weight:800;border-top:2px solid var(--ink)}
table.tb input{margin:0;padding:5px 7px}
.neg{color:var(--bad);font-weight:700}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:14px}
.toolbar>*{margin:0}.toolbar label{margin-top:0}
.modal{position:fixed;inset:0;background:rgba(10,12,20,.55);z-index:60;overflow:auto;padding:3vh 12px}
.modal .box{max-width:880px;margin:0 auto;background:var(--card);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.mh{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card);border-radius:18px 18px 0 0;z-index:2}
.mh .x{border:0;background:none;font-size:28px;line-height:1;cursor:pointer;color:var(--muted)}
.mb{padding:16px 20px}.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end;position:sticky;bottom:0;z-index:5;flex-wrap:wrap;background:var(--card);border-radius:0 0 18px 18px}
.pickmap,.mapbox{position:relative;z-index:0;height:300px;border-radius:12px;border:1px solid var(--line);margin-top:10px;overflow:hidden}
.mapbox{height:calc(100vh - 330px);min-height:420px}
.pi-n{background:transparent!important;border:0!important;box-shadow:none!important;color:#fff!important;font-weight:800;font-size:11px;padding:0!important}.pi-n:before{display:none!important}
.nomap{padding:20px;text-align:center;color:var(--muted)}
.pin span{display:block;width:22px;height:22px;background:var(--accent);border:3px solid #fff;border-radius:50% 50% 50% 0;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.45)}
.geo{border:1px solid var(--line);border-radius:10px;margin-top:8px}
.geo button{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:8px 10px;font:inherit;cursor:pointer;color:var(--ink)}
.prev{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column}
.prev .bar2{display:flex;gap:10px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap;background:var(--card)}
.prev iframe{flex:1;border:0;background:#777;width:100%}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:90;display:grid;place-items:center;padding:20px}
#lb img{max-width:100%;max-height:100%;border-radius:8px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;z-index:99;font-weight:600;box-shadow:var(--shadow);max-width:90vw}
.bars .b{display:flex;align-items:center;gap:10px;margin:6px 0}.bars .b span:first-child{width:70px;font-size:13px}.bars .b .bar{flex:1}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:8px 0}.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:5px;vertical-align:-1px}
body[data-amb=android] .btn,body[data-amb=ios] .btn{padding:12px 16px}
body[data-amb=android] input,body[data-amb=android] select,body[data-amb=ios] input,body[data-amb=ios] select{padding:12px}
@media(max-width:820px){.g2,.g3,.g4,.cols{grid-template-columns:1fr}.list{grid-template-columns:1fr}.wrap{padding:16px 12px 60px}.top{padding:8px 12px}h1{font-size:24px}.mapbox{height:60vh}.modal{padding:0}.modal .box{border-radius:0;min-height:100vh}.mh,.mf{border-radius:0}}
</style>
<script src="/assistente-abas.js" data-tabs="nav.tabs .tab" data-auxilio="gerar"></script>
<script>
/* Guia passo a passo de cada aba (usado pelo botão "Auxílio de preenchimento" do assistente-abas.js) */
window.TC_GUIAS = {
  painel: [
    {sel:'.kpis', titulo:'1 / 3 — Indicadores da obra', dica:'Resumo das ocorrências: vistoriadas, aguardando prioridade do gestor, planejadas, em execução e executadas, além das execuções a conferir pelo fiscal. Aqui você só confere; o trabalho é feito nas próximas abas.'},
    {sel:'.card .bar', titulo:'2 / 3 — Financeiro da obra', dica:'Compara o valor do contrato com o já medido e com o executado e conferido a medir. Valores truncados em 2 casas, como na medição.', norma:'Lei 14.133/2021 — acompanhamento da execução e medição do contrato.'},
    {sel:'.card[style*="margin-top:16px"]', titulo:'3 / 3 — Pendências', dica:'Lista o que ainda trava o fluxo: ocorrências sem coordenadas, sem prioridade confirmada, execuções sem conferência e serviços sem preço no catálogo.'}
  ],
  vistoria: [
    {sel:'[data-act=ocNew]', titulo:'1 / 4 — Nova ocorrência', dica:'O fiscal clica aqui para cadastrar cada rua/local com problema: endereço ou coordenadas (digitadas, pelo mapa ou pela foto georreferenciada), fotos, descrição e a prioridade sugerida (Alta, Média ou Baixa).'},
    {sel:'[data-k=ocSt]', titulo:'2 / 4 — Filtro por situação', dica:'Mostra só as ocorrências na situação escolhida (vistoriada, planejada, em execução, executada ou medida).'},
    {sel:'[data-k=ocPri]', titulo:'3 / 4 — Filtro por prioridade', dica:'Mostra só as ocorrências da prioridade escolhida. A prioridade final é confirmada pelo gestor na aba Planejamento.'},
    {sel:'#busca', titulo:'4 / 4 — Buscar', dica:'Procure por rua, bairro, trecho da descrição ou número da ocorrência.'}
  ],
  plan: [
    {sel:'.card .g4', titulo:'1 / 6 — Custo e saldo do contrato', dica:'Mostra o valor do contrato, o já medido, o conferido a medir e o programado para as próximas semanas. O custo só vira medição depois que o fiscal confere em campo (antes, depois e qualidade). Se a programação passar do saldo, aparece um alerta.'},
    {sel:'[data-k=plF]', titulo:'2 / 6 — Quais ocorrências mostrar', dica:'Escolha entre as que aguardam confirmação de prioridade, as sem semana definida ou todas as abertas.'},
    {sel:'.list .item', titulo:'3 / 6 — Cada ocorrência', dica:'Use “Planejar” para definir a forma de solução, o serviço do contrato, a quantidade prevista e a semana. “Confirmar prioridade” valida a prioridade sugerida pelo fiscal.'},
    {sel:'#bulkDia', titulo:'4 / 6 — Semana para vários de uma vez', dica:'Marque as ocorrências, escolha qualquer dia da semana desejada e use “Atribuir semana aos selecionados”. Também dá para confirmar a prioridade de todos os marcados.'},
    {sel:'input[data-chg=semDia]', titulo:'5 / 6 — Programação semanal', dica:'Escolha o dia para ver a semana programada, agrupada por serviço, com quantidades previstas. Use ◀ e ▶ para trocar de semana.'},
    {sel:'[data-act=relProg]', titulo:'6 / 6 — Gerar a programação', dica:'Gera o PDF da programação semanal para enviar à empresa contratada.'}
  ],
  atend: [
    {sel:'input[type=date][data-chg=dia]', titulo:'1 / 5 — Data do atendimento', dica:'Dia em que o serviço foi executado. As execuções registradas nesta data alimentam o RDO e o relatório fotográfico automaticamente.'},
    {sel:'[data-act=atSub][data-v=aat]', titulo:'2 / 5 — A atender e Atendidas', dica:'“A atender” lista as ocorrências que ainda faltam; “Atendidas” mostra as execuções já registradas, com a conferência do fiscal.'},
    {sel:'#se-q', titulo:'3 / 5 — Filtrar a lista', dica:'Filtre por semana programada, bairro ou palavra-chave (rua, descrição, número). Em uma rua com muitos buracos, pesquise o nome da rua para ver todos.'},
    {sel:'#se-lista', titulo:'4 / 5 — Registrar a execução', dica:'Toque em “Registrar execução” na ocorrência: rua, bairro, medidas e serviço planejado já vêm preenchidos. Anexe as fotos do depois e salve.'},
    {sel:'[data-act=selExLote]', titulo:'5 / 5 — Registrar várias de uma vez', dica:'Marque as ocorrências e registre todas conforme o planejado (serviço e quantidade previstos). Depois anexe as fotos abrindo cada execução.'}
  ],
  exec: [
    {sel:'input[type=date][data-chg=dia]', titulo:'1 / 4 — Dia do RDO', dica:'Escolha o dia (ou use ‹ e ›). O RDO já vem montado com as execuções registradas na aba Atendimento: você só confere.'},
    {sel:'.card h3', titulo:'2 / 4 — RDO do dia', dica:'Resumo automático: execuções, ocorrências atendidas, serviços e quantidades, descrição e fotos do dia.'},
    {sel:'details', titulo:'3 / 4 — Dados complementares (opcional)', dica:'Clima, efetivo, equipamentos, jornada e observações para o modelo oficial. Só preencha se quiser que saiam no RDO.'},
    {sel:'[data-act=relRDOxlsDia]', titulo:'4 / 4 — Gerar o RDO', dica:'Gere o RDO deste dia em PDF ou o Excel no modelo oficial, e o relatório fotográfico do dia.'}
  ],
  mapa: [
    {sel:'[data-k=mapSt]', titulo:'1 / 3 — Filtrar pela situação', dica:'Mostra no mapa só as ocorrências na situação escolhida.'},
    {sel:'[data-act=mapFit]', titulo:'2 / 3 — Enquadrar todas', dica:'Ajusta o zoom para mostrar todas as ocorrências com coordenadas.'},
    {sel:'#mapa', titulo:'3 / 3 — Mapa', dica:'A cor do marcador indica a prioridade (alta, média, baixa) e o verde indica executada ou medida. Clique em um marcador para abrir a ocorrência.'}
  ],
  med: [
    {sel:'input[data-k=de]', titulo:'1 / 6 — Período da medição', dica:'Data inicial e final do período medido. Soma as quantidades das execuções conferidas nesse intervalo.'},
    {sel:'input[data-k=conf]', titulo:'2 / 6 — Somente execuções conferidas', dica:'Deixe marcado: só entram na medição as execuções que o fiscal conferiu. As não conferidas ficam de fora.'},
    {sel:'.tablewrap', titulo:'3 / 6 — Conferir a prévia', dica:'Confira quantidades, valores (truncados em 2 casas), acumulado anterior, contratado e saldo. Saldo negativo (⚠) indica serviço medido acima do contratado.', norma:'Lei 14.133/2021 — medição conforme o executado e o preço contratado.'},
    {sel:'[data-act=medPrint]', titulo:'4 / 6 — Boletim e Excel', dica:'Gere o boletim em PDF/Word ou o Excel no modelo oficial (Boletim, Cronograma e Memória de cálculo).'},
    {sel:'[data-act=bolImp]', titulo:'5 / 6 — Importar boletim anterior', dica:'Importe o Excel de uma medição anterior para continuar a numeração e os acumulados.'},
    {sel:'[data-act=medFechar]', titulo:'6 / 6 — Fechar a medição', dica:'Só o gestor fecha. Depois de fechada, as execuções ficam vinculadas à medição e não entram em outra.'}
  ],
  crono: [
    {sel:'input[data-chg=cronoN]', titulo:'1 / 4 — Número de meses', dica:'Prazo do cronograma em meses. O mês 1 corresponde à medição nº 1, e assim por diante.'},
    {sel:'[data-act=cronoAuto]', titulo:'2 / 4 — Redistribuir saldo', dica:'Distribui o saldo ainda não medido entre os meses seguintes, fechando 100%.'},
    {sel:'.tablewrap', titulo:'3 / 4 — % previsto por capítulo', dica:'Meses medidos (verde) vêm das medições. Nos demais, informe o % previsto de cada capítulo; o programa calcula os valores e confere se fecha 100%.'},
    {sel:'[data-act=cronoXls]', titulo:'4 / 4 — Exportar', dica:'Exporta o cronograma físico-financeiro no modelo oficial.'}
  ],
  rel: [
    {sel:'input[data-k=de]', titulo:'1 / 5 — Período dos relatórios', dica:'Datas “De” e “Até”. Valem para o RDO, o relatório fotográfico e o de vistoria.'},
    {sel:'[data-act=relRDO]', titulo:'2 / 5 — RDO', dica:'Um RDO por dia do período, em PDF/impressão ou Excel no modelo oficial (uma aba por dia).'},
    {sel:'[data-act=relFoto]', titulo:'3 / 5 — Relatório fotográfico', dica:'Fotos da execução por dia, com fase, local, coordenadas e data/hora.'},
    {sel:'select[data-k=vPri]', titulo:'4 / 5 — Relatório de vistoria', dica:'Escolha prioridade e situação para listar as ocorrências desejadas.'},
    {sel:'input[data-k=semDia]', titulo:'5 / 5 — Programação semanal', dica:'Escolha um dia da semana e gere a programação para a empresa.'}

function lerExif(buf){const v=new DataView(buf);if(v.byteLength<4||v.getUint16(0)!==0xFFD8)return {};let off=2;

 try{if(i0[0x8769]){const ex=ifd(u32(i0[0x8769].v));if(ex[0x9003]){const s=val(ex[0x9003]);const m=/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/.exec(s||'');if(m)out.data=m[1]+'-'+m[2]+'-'+m[3]+'T'+m[4]+':'+m[5]+':'+m[6]}}}catch(e){}

/* ===================== NUVEM (login único do site) + SALVAR COMO ===================== */
/* Cada obra é salva sozinha na nuvem (Firebase do site), ligada ao seu login, e continua salva no aparelho.
   As FOTOS ficam só no aparelho e no backup .json (limite de tamanho do banco); o resto da obra vai para a nuvem. */
const NUV={estado:'local',msg:'',hora:'',ad:null,timers:{},pend:new Set(),pronto:false};
const NUV_COL='obrasServicos';
function nuvSet(est,msg){NUV.estado=est;NUV.msg=msg||'';NUV.hora=new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});try{renderTop()}catch(e){}}
function nuvChip(){const t={local:['💾 Salvo no aparelho','#5a6075'],sync:['☁ Sincronizando…','#b7791f'],ok:['☁ Salvo na nuvem '+NUV.hora,'#2e7d4f'],erro:['⚠ Nuvem indisponível — salvo no aparelho','#b7791f']}[NUV.estado]||['💾 Salvo no aparelho','#5a6075'];return `<span class="chip" style="--c:${t[1]}" title="${esc(NUV.msg||'Os dados ficam salvos neste aparelho. Com o login do site, também são salvos na nuvem (sem as fotos).')}">${t[0]}</span>`}
const _b64=buf=>{let s='';const u=new Uint8Array(buf);for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const _deb64=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
async function nuvPack(txt){if(window.CompressionStream){const r=await new Response(new Blob([txt]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer();return {gz:true,s:_b64(r)}}return {gz:false,s:txt}}
async function nuvUnpack(gz,s){if(!gz)return s;return await new Response(new Blob([_deb64(s)]).stream().pipeThrough(new DecompressionStream('gzip'))).text()}
const NUV_PARTE=700000;
/* adaptador real (Firestore); nos testes é trocado por window.TC_NUVEM_FAKE */
async function nuvAdaptador(){
 if(window.TC_NUVEM_FAKE)return window.TC_NUVEM_FAKE;
 const cfg=window.FIREBASE_CONFIG;if(!cfg||!cfg.apiKey)return null;
 const SDK='https://www.gstatic.com/firebasejs/12.19.0/';
 const [A,Au,F]=await Promise.all([import(SDK+'firebase-app.js'),import(SDK+'firebase-auth.js'),import(SDK+'firebase-firestore.js')]);
 const app=A.getApps().length?A.getApps()[0]:A.initializeApp(cfg);const a=Au.getAuth(app);let d;try{d=F.initializeFirestore(app,{experimentalAutoDetectLongPolling:true})}catch(_){d=F.getFirestore(app)}
 const u=await new Promise(res=>{const off=Au.onAuthStateChanged(a,x=>{off();res(x)})});if(!u)return null;
 return {uid:u.uid,
  async list(){const q=await F.getDocs(F.query(F.collection(d,NUV_COL),F.where('uid','==',u.uid)));const out=[];for(const s of q.docs){const x=s.data();try{out.push({docId:s.id,obraId:x.obraId,atualizadoEm:x.atualizadoEm||0,texto:await nuvUnpack(x.gz,(x.partes||[]).join(''))})}catch(e){console.warn('Nuvem: obra ilegível',s.id,e)}}return out},
  async put(o,txt){const p=await nuvPack(txt);const partes=[];for(let i=0;i<p.s.length;i+=NUV_PARTE)partes.push(p.s.slice(i,i+NUV_PARTE));if(partes.join('').length>900000)throw new Error('obra grande demais para a nuvem');await F.setDoc(F.doc(d,NUV_COL,u.uid+'_'+o.id),{uid:u.uid,obraId:o.id,nome:String(o.nome||'').slice(0,200),contrato:String(o.contrato||'').slice(0,60),atualizadoEm:o._salvoEm||Date.now(),gz:p.gz,partes,versao:1,gravadoEm:F.serverTimestamp()})},
  async del(obraId){await F.deleteDoc(F.doc(d,NUV_COL,u.uid+'_'+obraId))}}}
function nuvTexto(o){const c=Object.assign({},o);return JSON.stringify(c)}
async function nuvEnviar(o){if(!NUV.ad)return;nuvSet('sync');try{if(!o._dono)o._dono=NUV.ad.uid;await NUV.ad.put(o,nuvTexto(o));nuvSet('ok')}catch(e){console.warn('Nuvem:',e);nuvSet('erro',String(e&&e.message||e))}}
function nuvAgendar(o){if(!NUV.ad||!NUV.pronto)return;if(o._dono&&o._dono!==NUV.ad.uid)return;NUV.pend.add(o.id);clearTimeout(NUV.timers[o.id]);NUV.timers[o.id]=setTimeout(()=>nuvDescarga(o.id),4000)}
function nuvDescarga(id){clearTimeout(NUV.timers[id]);if(!NUV.pend.has(id))return;NUV.pend.delete(id);const o=S.obras[id];if(o)nuvEnviar(o)}
function nuvApagar(id){if(!NUV.ad)return;NUV.pend.delete(id);NUV.ad.del(id).catch(e=>console.warn('Nuvem:',e))}
async function nuvIniciar(){
 if(NUV.ad)return;
 try{const ad=await nuvAdaptador();if(!ad){nuvSet('local');return}NUV.ad=ad;nuvSet('sync');
  const nuv=await ad.list();let baixadas=0,enviadas=0;const vistas=new Set();
  for(const x of nuv){vistas.add(x.obraId);let r;try{r=JSON.parse(x.texto)}catch(e){continue}const loc=S.obras[x.obraId];
   if(!loc||(x.atualizadoEm||0)>(loc._salvoEm||0)+1000){r._salvoEm=x.atualizadoEm;r._dono=ad.uid;S.obras[r.id]=r;await DB.put('kv','obra:'+r.id,r);baixadas++}
   else if((loc._salvoEm||0)>(x.atualizadoEm||0)+1000&&(!loc._dono||loc._dono===ad.uid)){await nuvEnviar(loc);enviadas++}}
  for(const o of Object.values(S.obras)){if(vistas.has(o.id))continue;if(o._dono&&o._dono!==ad.uid)continue;if(!o._salvoEm)o._salvoEm=Date.now();await nuvEnviar(o);enviadas++}
  NUV.pronto=true;nuvSet('ok',baixadas||enviadas?`${baixadas} obra(s) baixada(s) e ${enviadas} enviada(s) na sincronização inicial.`:'');
  if(baixadas){toast(baixadas+' obra(s) atualizada(s) a partir da nuvem. As fotos ficam no aparelho onde foram tiradas.',6000);render()}
 }catch(e){console.warn('Nuvem:',e);nuvSet('erro',String(e&&e.message||e))}}
function nuvLigar(){if(window.TC_ACESSO==='liberado'||window.TC_NUVEM_FAKE)nuvIniciar();else document.addEventListener('tc-acesso-liberado',()=>nuvIniciar(),{once:true})}

const DIST=new Map();
const distM=(a,b)=>{const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const fDist=m=>m<1000?Math.round(m)+' m':fN(m/1000,2)+' km';
const norm=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

function planLista(o,abertas){const f=S.f;let l=abertas;
 if(f.plF==='pend')l=l.filter(x=>!x.priConf);else if(f.plF==='sem')l=l.filter(x=>!x.semana);

 <div class="g2"><label>Ordem de atendimento<select data-chg="piP" data-k="ordem"><option value="pri" ${P.ordem==='pri'?'selected':''}>Prioridade (alta → baixa); mais antigas primeiro</option><option value="antig" ${P.ordem==='antig'?'selected':''}>Mais antigas primeiro</option><option value="vol" ${P.ordem==='vol'?'selected':''}>Maior volume primeiro</option></select></label>
 <div><div class="small muted">Prioridades incluídas</div><div class="row gap">${Object.entries(PRI).map(([k,v])=>`<label class="chk"><input type="checkbox" data-chg="piP" data-k="pri.${k}" ${P.pris[k]?'checked':''}> ${v.l}</label>`).join('')}</div></div></div>
 <div style="margin:8px 0"><label>Bairros — digite para procurar e toque no bairro para somar à seleção<input id="pi-bq" placeholder="ex.: Nova Cidade" autocomplete="off" data-inp="piBq"></label><div id="pi-bsug" class="geo"></div>
 <label>Bairros selecionados (vazio = todos os bairros)<input id="pi-bsel" readonly value="${esc((P.bairros||[]).join('; '))}" placeholder="Todos os bairros"></label>
 <div class="row gap" style="margin-top:4px"><button class="btn sm" data-act="piBTodos">Todos os bairros</button><button class="btn sm" data-act="piBLimpar">✕ Limpar seleção</button></div></div>
 <div class="row gap"><label class="chk"><input type="checkbox" data-chg="piP" data-k="soSem" ${P.soSem?'checked':''}> Só ocorrências ainda sem semana definida</label><label class="chk"><input type="checkbox" data-chg="piP" data-k="soVist" ${P.soVist?'checked':''}> Só ocorrências já vistoriadas pelo fiscal (com medidas)</label><label class="chk"><input type="checkbox" data-chg="piP" data-k="soConf" ${P.soConf?'checked':''}> Só com prioridade já confirmada</label></div>
 <h4 style="margin-top:12px">2. Raio e caminhões</h4>
 <div class="g4">${n('raioKm','Raio para agrupar (km) — 0 = sem agrupar')}${n('dens','Peso específico do asfalto (t/m³)')}${n('carga','Carga de cada caminhão (t)')}${n('camDia','Caminhões por dia')}</div>
 <label>Serviço padrão (para ocorrências ainda sem serviço definido)<select data-chg="piP" data-k="svcPad"><option value="">— nenhum (custo fica zerado) —</option>${O().servicos.map(x=>`<option value="${x.id}" ${P.svcPad===x.id?'selected':''}>${esc((x.codigo?x.codigo+' — ':'')+x.descricao.slice(0,90))} (${esc(x.unidade)})</option>`).join('')}</select></label>
 <div class="g4">${n('qtdPad','Volume quando não informado (m³)')}${n('esp','Espessura p/ serviços em m² (cm)')}</div>
 <h4 style="margin-top:12px">3. Período</h4>

 <div class="g4">${n('kmh','Velocidade média no trânsito (km/h)')}${n('minFix','Tempo fixo por ocorrência (min)')}${n('minM3','Tempo de serviço por m³ (min)')}<label>Relatório por<select data-chg="piP" data-k="relPor"><option value="dia" ${P.relPor!=='bai'?'selected':''}>Dia / frente de trabalho</option><option value="bai" ${P.relPor==='bai'?'selected':''}>Bairro</option></select></label></div>

 <p class="small muted">Início sugerido às 09:00 e fim às 17:00 para fugir dos picos (7h–9h e 17h–19h). O programa não tem trânsito em tempo real: use o link “Abrir no Google Maps” do relatório no dia.</p>

function piBSel(){const e=$('#pi-bsel');if(e)e.value=(M.p.bairros||[]).join('; ');if(M.res)piCalc()}
function piCalc(){const o=O(),P=M.p,SP=saldoPlan(o);const cap=P.camDia*P.carga;
 if(!(cap>0)||!(P.dens>0)||!(P.n>=1)){toast('Informe carga, caminhões por dia, peso específico e o período.');return}
 const cmp=P.ordem==='antig'?(a,b)=>(a.oc.criadoEm||'').localeCompare(b.oc.criadoEm||'')||a.oc.num-b.oc.num:P.ordem==='vol'?(a,b)=>b.v.m3-a.v.m3||a.oc.num-b.oc.num:(a,b)=>(PRI[priEf(a.oc)].o-PRI[priEf(b.oc)].o)||(a.oc.criadoEm||'').localeCompare(b.oc.criadoEm||'')||a.oc.num-b.oc.num;
 let pool=o.ocorrencias.filter(x=>x.status!=='medida'&&x.status!=='executada'&&P.pris[priEf(x)]&&(!P.soVist||x.vistFiscal)&&(!(P.bairros||[]).length||P.bairros.includes((x.bairro||'').trim()))&&(!P.soSem||!x.semana)&&(!P.soConf||x.priConf)).map(x=>({oc:x,v:piVol(o,x,P)}));pool.sort(cmp);
 const nTot=pool.length;const nd=P.unid==='dia'?P.n:P.unid==='semana'?P.n*5:P.n*22;const R=Math.max(0,P.raioKm)*1000;const budget=P.limSaldo?SP.livre:Infinity;let gasto=0,dia=P.inicio,cnt=0;const dias=[];
 let guard=0;while(cnt<nd&&pool.length&&guard++<4000){const wd=pd(dia).getUTCDay();if(wd===0||wd===6){dia=addDias(dia,1);continue}
  let used=0,custo=0,anchor=null;const items=[];
  for(;;){const i=pool.findIndex(p=>{if(items.length&&used+p.v.t>cap+1e-9)return false;if(gasto+p.v.custo>budget+1e-9)return false;if(anchor&&R>0&&p.oc.lat!=null&&distM(anchor,{lat:p.oc.lat,lng:p.oc.lng})>R)return false;return true});
   if(i<0)break;const p=pool.splice(i,1)[0];items.push(p);used+=p.v.t;custo=r2(custo+p.v.custo);gasto=r2(gasto+p.v.custo);if(!anchor&&p.oc.lat!=null)anchor={lat:p.oc.lat,lng:p.oc.lng}}
  if(!items.length)break;dias.push({dia,items,anchor,t:used,m3:items.reduce((s,p)=>s+p.v.m3,0),cargas:Math.ceil(used/P.carga-1e-9),custo});cnt++;dia=addDias(dia,1)}
 dias.forEach(d=>{d.rota=piRota(d.items);d.hor=piHoras(P,d.rota)});
 M.res={dias,resto:pool,nTot,cap,SP};piMostra()}
function piMostra(){const {dias,resto,nTot,cap,SP}=M.res,P=M.p,box=$('#pi-res'),bt=$('#pi-ap');if(!box)return;if(M.map){M.map.remove();M.map=null}
 const mesN=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
 const chave=d=>P.unid==='dia'?d:P.unid==='semana'?isoWeek(d):d.slice(0,7);const rot=(k)=>P.unid==='dia'?fData(k):P.unid==='semana'?labSem(k):mesN[+k.slice(5)-1]+'/'+k.slice(0,4);
 const gr=new Map();dias.forEach(d=>{const k=chave(d.dia);if(!gr.has(k))gr.set(k,[]);gr.get(k).push(d)});
 let acc=SP.livre;const tot={n:0,m3:0,t:0,c:0,cu:0};
 const linhas=[...gr.entries()].map(([k,ds])=>{const n=ds.reduce((s,d)=>s+d.items.length,0),m3=ds.reduce((s,d)=>s+d.m3,0),t=ds.reduce((s,d)=>s+d.t,0),c=ds.reduce((s,d)=>s+d.cargas,0),cu=ds.reduce((s,d)=>r2(s+d.custo),0);acc=r2(acc-cu);tot.n+=n;tot.m3+=m3;tot.t+=t;tot.c+=c;tot.cu=r2(tot.cu+cu);
  const ruas=ds.map(d=>{const m=new Map();d.items.forEach(({oc,v})=>{const kk=(oc.rua||'(sem nome da rua)')+(oc.bairro?' — '+oc.bairro:'');const e=m.get(kk)||{n:0,m3:0,sc:0};e.n++;e.m3+=v.m3;if(oc.lat==null)e.sc++;m.set(kk,e)});
   return `<p class="small" style="margin:3px 0"><b>${fData(d.dia).slice(0,5)}</b> · ${fN(d.t,1)} t · ${d.cargas} carga(s): ${[...m.entries()].map(([r,e])=>esc(r)+' <span class="muted">('+e.n+' ocorr., '+fN(e.m3)+' m³'+(e.sc?', sem coordenada':'')+')</span>').join('; ')}</p>`}).join('');
  return `<tr><td><b>${esc(rot(k))}</b></td><td class="r">${n}</td><td class="r">${fN(m3)}</td><td class="r">${fN(t,1)}</td><td class="r">${c}</td><td class="r">${fN(cu)}</td><td class="r ${acc<0?'neg':''}">${fN(acc)}</td></tr><tr><td colspan="7" style="background:var(--bg,#f6f7f9)">${ruas}</td></tr>`}).join('');
 const sem=resto.length;const nAss=dias.reduce((s,d)=>s+d.items.filter(p=>p.v.assum).length,0);
 box.innerHTML=`<div class="alert" style="background:#eef4fb;border-color:#2563a8">Capacidade por dia: <b>${P.camDia}</b> caminhão(ões) × <b>${fN(P.carga,1)} t</b> = <b>${fN(cap,1)} t</b> ≈ <b>${fN(cap/P.dens)} m³</b> de massa asfáltica (peso específico ${fN(P.dens)} t/m³). Saldo livre atual: <b>${fR(SP.livre)}</b>.</div>
 ${dias.length?`<div class="tablewrap"><table class="tb"><thead><tr><th>Período</th><th class="r">Ocorr.</th><th class="r">m³</th><th class="r">Toneladas</th><th class="r">Cargas</th><th class="r">Custo (R$)</th><th class="r">Saldo após (R$)</th></tr></thead><tbody>${linhas}</tbody><tfoot><tr><td><b>Total</b></td><td class="r"><b>${tot.n}</b></td><td class="r"><b>${fN(tot.m3)}</b></td><td class="r"><b>${fN(tot.t,1)}</b></td><td class="r"><b>${tot.c}</b></td><td class="r"><b>${fN(tot.cu)}</b></td><td></td></tr></tfoot></table></div>`:`<p class="muted">Nenhuma ocorrência coube nos critérios escolhidos.${P.soVist&&!O().ocorrencias.some(x=>x.vistFiscal)?' Ainda não há ocorrências vistoriadas pelo fiscal: faça o Atendimento do fiscal ou desmarque “Só ocorrências já vistoriadas pelo fiscal” para planejar com volume estimado.':''}</p>`}
 ${dias.length?`<h4 style="margin-top:12px">🗺 Mapa dos grupos de atendimento</h4><div class="row gap"><label style="margin:0">Colorir por<select data-chg="piMapaModo"><option value="per" ${M.mapModo!=='bai'?'selected':''}>Período (${P.unid==='dia'?'dia':P.unid==='semana'?'semana':'mês'}) — cada círculo é a frente de trabalho do dia</option><option value="bai" ${M.mapModo==='bai'?'selected':''}>Bairro</option></select></label></div><div id="pi-leg" class="row gap" style="flex-wrap:wrap;margin:6px 0"></div><div id="pi-mapa" class="mapbox" style="height:420px"></div><p class="small muted">Cada círculo tracejado mostra o raio de ${fN(P.raioKm)} km a partir da ocorrência de partida do dia: é o grupo que as equipes e os caminhões atendem juntos. Ocorrências sem coordenada não aparecem no mapa.</p>`:''}
 <p class="small" style="margin-top:8px">${tot.n} de ${nTot} ocorrência(s) distribuída(s).${sem?` <b>${sem}</b> ficam para depois (fora do período ou do saldo).`:''}${(()=>{const fo={gestor:0,fiscal:0,estimado:0};dias.forEach(d=>d.items.forEach(p=>fo[p.v.fonte]++));return ` <span class="muted">Origem do volume: ${fo.fiscal} medido(s) pelo fiscal · ${fo.gestor} definido(s) pelo gestor · ${fo.estimado} estimado(s) (${fN(P.qtdPad)} m³ cada).</span>`})()}</p>`;
 if(bt)bt.disabled=!dias.length;const br=$('#pi-rel');if(br)br.disabled=!dias.length;if(dias.length){M.mapF=null;piMapa()}}
const PI_COR=['#2563a8','#c0392b','#2e8b57','#d98a00','#6a4fb3','#0f8b8d','#b5179e','#7a5c00','#e4572e','#3d5a80','#6b8e00','#555555'];
const PI_MES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function piMapa(){const el=$('#pi-mapa');if(!el||!M.res)return;if(typeof L==='undefined'){el.innerHTML='<div class="nomap">Mapa indisponível (sem internet). A lista acima continua valendo.</div>';return}
 const c=S.settings.mapa;const map=L.map(el).setView([c.lat,c.lng],c.zoom);L.tileLayer(OSM,{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);M.map=map;M.pl=L.layerGroup().addTo(map);piMapaDesenha(true);
 setTimeout(()=>{if(M&&M.map===map){map.invalidateSize({animate:false});piMapaDesenha(true)}},120)}
function piMapaDesenha(fit){if(!M||!M.map||!M.res)return;const P=M.p,modo=M.mapModo||'per',R=Math.max(0,P.raioKm)*1000;M.pl.clearLayers();
 const kper=d=>P.unid==='dia'?d:P.unid==='semana'?isoWeek(d):d.slice(0,7);const rper=k=>P.unid==='dia'?fData(k):P.unid==='semana'?labSem(k):PI_MES[+k.slice(5)-1]+'/'+k.slice(0,4);
 const g=new Map();const pts=[];
 M.res.dias.forEach(d=>{const kd=kper(d.dia);d.items.forEach(({oc})=>{const k=modo==='bai'?((oc.bairro||'').trim()||'(sem bairro)'):kd;if(!g.has(k))g.set(k,{cor:PI_COR[g.size%PI_COR.length],n:0,sc:0,lab:modo==='bai'?k:rper(k)});const e=g.get(k);e.n++;if(oc.lat==null)e.sc++})});
 const leg=$('#pi-leg');if(leg)leg.innerHTML=`<button class="btn sm ${M.mapF?'':'pri'}" data-act="piMapaF" data-k="">Todos</button>`+[...g.entries()].map(([k,e])=>`<button class="btn sm ${M.mapF===k?'pri':''}" data-act="piMapaF" data-k="${esc(k)}" style="border-left:8px solid ${e.cor}">${esc(e.lab)} · ${e.n}</button>`).join('');
 M.res.dias.forEach(d=>{const kd=kper(d.dia);
  if(modo==='per'&&R>0&&d.anchor&&(!M.mapF||M.mapF===kd)){const e=g.get(kd);L.circle([d.anchor.lat,d.anchor.lng],{radius:R,color:e.cor,weight:2,dashArray:'6 6',fillColor:e.cor,fillOpacity:.06}).bindTooltip('Frente de trabalho de '+fData(d.dia)).addTo(M.pl)}
  if(modo==='per'&&d.rota&&(!M.mapF||M.mapF===kd)){const pl=d.rota.ord.filter(p=>p.oc.lat!=null).map(p=>[p.oc.lat,p.oc.lng]);if(pl.length>1)L.polyline(pl,{color:g.get(kd).cor,weight:3,opacity:.8}).addTo(M.pl)}
  d.items.forEach(p=>{const oc=p.oc;if(oc.lat==null)return;const k=modo==='bai'?((oc.bairro||'').trim()||'(sem bairro)'):kd;if(M.mapF&&M.mapF!==k)return;const e=g.get(k);const ordn=d.rota?d.rota.ord.indexOf(p)+1:0;
   const mk=L.circleMarker([oc.lat,oc.lng],{radius:M.mapF&&modo==='per'?10:7,color:'#fff',weight:2,fillColor:e.cor,fillOpacity:.95}).bindTooltip((ordn&&modo==='per'?'Parada '+ordn+' · ':'')+'#'+oc.num+' '+ocLocal(oc)+' · '+fData(d.dia).slice(0,5)).addTo(M.pl);
   if(M.mapF&&modo==='per'&&ordn)mk.bindTooltip(String(ordn),{permanent:true,direction:'center',className:'pi-n'});pts.push([oc.lat,oc.lng])})});
 if(fit&&pts.length){try{M.map.fitBounds(pts,{padding:[30,30],animate:false,maxZoom:16})}catch(e){}}}
/* rotas, horários e relatório do planejamento instruído */
const piMin=s=>{const [h,m]=String(s||'0:0').split(':').map(Number);return (h||0)*60+(m||0)};
const piHM=m=>{m=Math.round(m);return String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
function piRota(its){const com=its.filter(p=>p.oc.lat!=null),sem=its.filter(p=>p.oc.lat==null);const d=(a,b)=>distM(a.oc,b.oc);let ord=[];
 if(com.length){ord=[com[0]];const rest=com.slice(1);while(rest.length){const l=ord[ord.length-1];let bi=0,bd=Infinity;rest.forEach((p,i)=>{const x=d(l,p);if(x<bd){bd=x;bi=i}});ord.push(rest.splice(bi,1)[0])}
  let mel=true,it=0;while(mel&&it++<60){mel=false;for(let i=1;i<ord.length;i++)for(let j=i+1;j<ord.length;j++){const a=ord[i-1],b=ord[i],c=ord[j],e=ord[j+1];const antes=d(a,b)+(e?d(c,e):0),depois=d(a,c)+(e?d(b,e):0);if(depois<antes-1){ord=ord.slice(0,i).concat(ord.slice(i,j+1).reverse(),ord.slice(j+1));mel=true}}}}
 const tr=ord.map((p,i)=>i?d(ord[i-1],p)*1.3:0);return {ord:ord.concat(sem),nCom:ord.length,tr:tr.concat(sem.map(()=>0)),km:tr.reduce((s,x)=>s+x,0)/1000}}
function piHoras(P,r){let t=piMin(P.ini);const fim=piMin(P.fim),a1=piMin(P.almIni),a2=piMin(P.almFim);let alm=false,pico=false,serv=0,desl=0;const L=[];
 r.ord.forEach((p,i)=>{const dm=r.tr[i]/1000/Math.max(1,P.kmh)*60;if(dm>0){if((t>=420&&t<540)||(t>=1020&&t<1140))pico=true;t+=dm;desl+=dm}
  if(!alm&&t>=a1&&a2>a1){t=Math.max(t,a2);alm=true}const dur=P.minFix+p.v.m3*P.minM3;L.push({ini:t,fim:t+dur});t+=dur;serv+=dur});
 return {L,fimDia:t,passa:t>fim,pico,serv,desl}}
function piLinks(r){const pts=r.ord.filter(p=>p.oc.lat!=null).map(p=>p.oc.lat.toFixed(6)+','+p.oc.lng.toFixed(6));const out=[];if(pts.length===1)return ['https://www.google.com/maps/search/?api=1&query='+pts[0]];for(let i=0;i<pts.length-1;i+=9)out.push('https://www.google.com/maps/dir/'+pts.slice(i,i+10).join('/'));return out}
function piSvg(r){const pts=r.ord.filter(p=>p.oc.lat!=null);if(!pts.length)return '';const W=360,H=230,m=22;const lat0=pts.reduce((s,p)=>s+p.oc.lat,0)/pts.length,k=Math.cos(lat0*Math.PI/180);
 const X=pts.map(p=>p.oc.lng*k),Y=pts.map(p=>-p.oc.lat);const x0=Math.min(...X),x1=Math.max(...X),y0=Math.min(...Y),y1=Math.max(...Y);const dx=x1-x0,dy=y1-y0;const sc=(dx||dy)?Math.min((W-2*m)/(dx||1e-12),(H-2*m)/(dy||1e-12)):0;
 const px=i=>m+(W-2*m)/2+(X[i]-x0-dx/2)*sc,py=i=>m+(H-2*m)/2+(Y[i]-y0-dy/2)*sc;
 return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="border:1px solid #ccd;background:#f4f6f8"><polyline fill="none" stroke="#2563a8" stroke-width="2" points="${pts.map((p,i)=>px(i).toFixed(1)+','+py(i).toFixed(1)).join(' ')}"/>${pts.map((p,i)=>`<circle cx="${px(i).toFixed(1)}" cy="${py(i).toFixed(1)}" r="9" fill="${i?'#c0392b':'#2e8b57'}"/><text x="${px(i).toFixed(1)}" y="${(py(i)+3.5).toFixed(1)}" font-size="10" font-weight="700" fill="#fff" text-anchor="middle">${i+1}</text>`).join('')}</svg>`}
function piRelatorio(){const o=O(),P=M.p,Rz=M.res;if(!Rz||!Rz.dias.length){toast('Calcule antes de gerar o relatório.');return}
 const dow=['dom','seg','ter','qua','qui','sex','sáb'];const dd=d=>fData(d).slice(0,5)+' ('+dow[pd(d).getUTCDay()]+')';

function ocLerKML(txt){const d=new DOMParser().parseFromString(txt,'application/xml');if(d.querySelector('parsererror'))throw new Error('arquivo KML inválido');
 const nome={};d.querySelectorAll('Schema SimpleField').forEach(f=>{const dn=f.querySelector('displayName');nome[f.getAttribute('name')]=_hk(dn?dn.textContent:f.getAttribute('name'))});
 const out=[];d.querySelectorAll('Placemark').forEach(pm=>{const pt=pm.querySelector('Point coordinates');if(!pt)return;const c=pt.textContent.trim().split(/[,\s]+/).map(Number);if(!isFinite(c[0])||!isFinite(c[1]))return;
  const a={};pm.querySelectorAll('SimpleData').forEach(x=>{a[nome[x.getAttribute('name')]||_hk(x.getAttribute('name'))]=x.textContent.trim()});
  const nm=(pm.querySelector('name')||{}).textContent||'';const ds=(pm.querySelector('description')||{}).textContent||'';const txt=ds.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
  out.push({kid:pm.getAttribute('id')||'',name:nm.trim(),tema:a.tema||'',bairro:a.bairro||'',setor:a.setor||'',lugar:a.lugar||'',rel:parseInt(a.relatosnoperiodo||a.relatosnototal)||0,prim:a.primeirorelatodata||_dBR(a.primeirorelato),ult:a.ultimorelatodata||_dBR(a.ultimorelato),prec:a.precisaodolocal||'',txt,lat:c[1],lng:c[0]})});
 return out}

 rows.forEach(r=>{const k={};Object.keys(r).forEach(h=>k[_hk(h)]=r[h]);const g=(...n)=>{for(const x of n)if(k[x]!==undefined&&String(k[x]).trim()!=='')return String(k[x]).trim();return ''};

 return `<div class="mh"><h3>${isNew?'Nova ocorrência':'Ocorrência nº '+d.num}</h3><button class="x" data-act="mClose">×</button></div><div class="mb">
 <fieldset><legend>1. Localização</legend><div class="g2"><label>Rua / endereço *<input id="oc-rua" value="${esc(d.rua)}" placeholder="Ex.: Rua das Flores, 120" ${dis}></label><label>Bairro<input id="oc-bairro" value="${esc(d.bairro)}" ${dis}></label></div>
 <label>Ponto de referência<input id="oc-ref" value="${esc(d.ref)}" ${dis}></label>
 <div class="g2"><label>Latitude<input id="oc-lat" inputmode="decimal" value="${inp(d.lat)}" placeholder="-22,52690" data-chg="coord" ${dis}></label><label>Longitude<input id="oc-lng" inputmode="decimal" value="${inp(d.lng)}" placeholder="-41,94560" data-chg="coord" ${dis}></label></div>
 <div class="row gap" style="margin-top:8px"><button class="btn sm pri" data-act="usarGPS" ${dis}>📍 Minha localização</button><button class="btn sm" data-act="buscarEnd" ${dis}>🔎 Buscar pelo endereço</button><button class="btn sm" data-act="revEnd" ${dis}>↻ Preencher endereço pelas coordenadas</button></div>
 <p class="small muted" id="oc-orig" style="margin:6px 0 0"></p><p class="small" id="oc-endst" style="margin:4px 0 0;color:#2563a8"></p><div id="geoRes"></div><p class="small muted" style="margin:6px 0 0">Você também pode clicar no mapa ou arrastar o pino para ajustar o ponto.</p><div id="pickMap" class="pickmap"></div></fieldset>
 <fieldset><legend>2. Fotos</legend><div class="row gap"><button class="btn" data-act="fotoCam" ${dis}>📷 Tirar foto</button><button class="btn" data-act="fotoGal" ${dis}>🖼 Escolher da galeria</button></div>
 <p class="small muted">Se a foto tiver coordenadas (EXIF) ou for tirada aqui com o GPS liberado, o ponto é preenchido automaticamente. Para melhor precisão, mantenha a localização da câmera ativada.</p><div id="fotosArea">${fotosArea(d.fotos,'oc')}</div></fieldset>
 <fieldset><legend>3. Problema identificado</legend><div class="row gap" style="margin:2px 0 6px">${["Buraco","Afundamento","Trinca / fissura","Desgaste do asfalto","Tampa de PV quebrada","Boca de lobo entupida","Falta de sinalização"].map(t=>`<button type="button" class="btn sm" data-act="ocPre" data-t="${t}" ${dis}>${t}</button>`).join("")}</div><label>Descrição do problema *<textarea id="oc-desc" ${dis}>${esc(d.desc)}</textarea></label><label>Sugestão de correção<textarea id="oc-sug" ${dis}>${esc(d.sug)}</textarea></label>
 <div class="g3"><label>Serviço sugerido<select id="oc-serv" ${dis}>${svcOptions(o,d.servSug,'— não definido —')}</select></label><label>Comprimento (m)<input id="oc-mc" inputmode="decimal" value="${inp(d.med&&d.med.c)}" ${dis}></label><label>Largura (m)<input id="oc-ml" inputmode="decimal" value="${inp(d.med&&d.med.l)}" ${dis}></label></div>
 <label>Prioridade sugerida pelo fiscal<div class="row gap" style="margin-top:6px">${Object.entries(PRI).map(([k,v])=>`<label class="chk" style="margin:0"><input type="radio" name="oc-pri" value="${k}" ${d.priF===k?'checked':''} ${dis}> <span class="chip" style="--c:${v.c}">${v.l}</span></label>`).join('')}</div></label></fieldset>
 ${d.hist.length?`<details><summary class="small">Histórico (${d.hist.length})</summary>${d.hist.map(h=>`<p class="small muted">${fDH(h.q)} · ${esc(h.quem)} · ${esc(h.acao)}</p>`).join('')}</details>`:''}</div>
 <div class="mf">${!isNew&&ed?'<button class="btn dan" data-act="ocDel">Excluir</button><span class="sp"></span>':''}<button class="btn" data-act="mCancel">Cancelar</button><button class="btn pri" data-act="ocSave" ${dis}>Salvar ocorrência</button>${isNew&&ed?'<button class="btn pri" data-act="ocSaveNext" title="Salva e já abre a câmera para o próximo registro">Salvar e registrar a próxima ⚡</button>':''}</div>`}
function origTxt(){const e=$('#oc-orig');if(e&&M)e.textContent=M.d.lat!=null&&M.d.origem?'Origem das coordenadas: '+ORIGEM[M.d.origem]:''}
function setCoord(lat,lng,origem,opt){opt=opt||{};if(!M)return;M.d.lat=lat;M.d.lng=lng;M.d.origem=origem;if(!opt.noAuto&&origem!=='endereco'&&M.t==='oc')autoEnd(lat,lng);const a=$('#oc-lat'),b=$('#oc-lng');if(a)a.value=inp(Number(lat.toFixed(6)));if(b)b.value=inp(Number(lng.toFixed(6)));origTxt();
 if(M.map&&!opt.noMarker){putMarker(lat,lng);if(opt.fly)M.map.setView([lat,lng],17,{animate:false})}}
function putMarker(lat,lng){if(!M||!M.map)return;if(M.mk)M.mk.setLatLng([lat,lng]);else{M.mk=L.marker([lat,lng],{draggable:true,icon:L.divIcon({className:'pin',html:'<span></span>',iconSize:[26,26],iconAnchor:[13,26]})}).addTo(M.map);M.mk.on('dragend',()=>{const p=M.mk.getLatLng();setCoord(p.lat,p.lng,'mapa',{noMarker:true})})}}
function initPick(){const el=$('#pickMap');if(!el)return;if(typeof L==='undefined'){el.innerHTML='<div class="nomap">Mapa indisponível (sem internet). Digite as coordenadas.</div>';return}
 const c=S.settings.mapa,d=M.d;const map=L.map(el).setView(d.lat!=null?[d.lat,d.lng]:[c.lat,c.lng],d.lat!=null?17:c.zoom);L.tileLayer(OSM,{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);M.map=map;
 if(d.lat!=null)putMarker(d.lat,d.lng);if(can('ocorr'))map.on('click',e=>{setCoord(e.latlng.lat,e.latlng.lng,'mapa',{});});setTimeout(()=>{if(M&&M.map===map)map.invalidateSize({animate:false})},90);origTxt()}
function modalEx(d,isNew){const o=O();const abertas=o.ocorrencias.filter(x=>x.status!=='medida'||x.id===d.ocorrenciaId).sort((a,b)=>a.num-b.num);const lock=!!d.medicaoNum;const dis=(can('exec')&&!lock)?'':'disabled';
 const itens=d.itens.length?d.itens:[{servicoId:'',qtd:''}];
 return `<div class="mh"><h3>${isNew?'Registrar execução':'Execução de '+fData(d.data)}</h3><button class="x" data-act="mClose">×</button></div><div class="mb">
 ${lock?`<div class="alert">Esta execução já foi incluída na medição nº ${d.medicaoNum} e não pode ser alterada.</div>`:''}
 <div class="g2"><label>Data da execução *<input type="date" id="ex-data" value="${d.data}" ${dis}></label><label>Ocorrência vinculada<select id="ex-oc" data-chg="exOc" ${dis}><option value="">— Serviço avulso (sem ocorrência) —</option>${abertas.map(x=>`<option value="${x.id}" ${d.ocorrenciaId===x.id?'selected':''}>#${x.num} · ${esc(ocLocal(x))}</option>`).join('')}</select></label></div>
 <div class="g2"><label>Rua / local<input id="ex-rua" value="${esc(d.local.rua)}" ${dis}></label><label>Bairro<input id="ex-bairro" value="${esc(d.local.bairro)}" ${dis}></label></div>
 <fieldset style="margin-top:12px"><legend>Serviços executados e quantidades</legend>
 <div class="g4"><label>Comprimento (m)<input id="ex-mc" inputmode="decimal" value="${inp(d.med.c)}" data-inp="medidas" ${dis}></label><label>Largura (m)<input id="ex-ml" inputmode="decimal" value="${inp(d.med.l)}" data-inp="medidas" ${dis}></label><label>Espessura (cm)<input id="ex-me" inputmode="decimal" value="${inp(d.med.e)}" data-inp="medidas" ${dis}></label><p class="small muted" id="medOut" style="margin-top:28px"></p></div>
 <div id="itens">${itens.map(i=>itemRow(o,i,dis)).join('')}</div><button class="btn sm" style="margin-top:8px" data-act="itemAdd" ${dis}>＋ outro serviço</button></fieldset>
 <fieldset><legend>Equipe e equipamentos do dia (entram no RDO)</legend><div id="equipe">${(d.equipe||[]).map(eqRow).join('')}</div><div class="row gap" style="margin-top:8px"><button class="btn sm" data-act="eqAdd" ${dis}>＋ Funcionário</button><button class="btn sm" data-act="eqAdd" data-k="eqp" ${dis}>＋ Equipamento</button></div><p class="small muted">Escolha a função e digite a quantidade; para outra função, toque em ＋ de novo. Se a mesma equipe atender várias ocorrências no dia, o RDO conta uma vez (vale o maior valor).</p></fieldset>
 <fieldset><legend>Fotos da execução</legend><div class="row gap"><button class="btn" data-act="fotoCam" ${dis}>📷 Tirar foto</button><button class="btn" data-act="fotoGal" ${dis}>🖼 Escolher da galeria</button><label style="margin:0">Fase das novas fotos<select id="exFase" style="width:auto"><option value="antes">Antes</option><option value="durante">Durante</option><option value="depois" selected>Depois</option></select></label></div><div id="fotosArea">${fotosArea(d.fotos,'ex')}</div></fieldset>
 <fieldset><legend>Descrição para o RDO</legend><label>Anotação de campo (escreva do seu jeito)<textarea id="ex-dc" ${dis}>${esc(d.descCampo)}</textarea></label>
 <div class="row gap" style="margin-top:8px"><button class="btn" data-act="melhorarIA" ${dis}>✨ Melhorar descrição (${S.settings.ia.prov==='gemini'?'Gemini':S.settings.ia.prov==='meta'?'Meta':'texto padrão, sem IA'})</button><span class="small muted" id="iaStatus"></span></div>
 <label>Descrição final (é a que sai no RDO)<textarea id="ex-df" ${dis}>${esc(d.desc)}</textarea></label>
 <label class="chk" style="margin-top:12px"><input type="checkbox" id="ex-conc" ${d.concluiu?'checked':''} ${dis}> O serviço desta ocorrência foi concluído</label></fieldset></div>
 <div class="mf">${!isNew&&!lock&&can('exec')?'<button class="btn dan" data-act="exDel">Excluir</button><span class="sp"></span>':''}<button class="btn" data-act="mCancel">Cancelar</button><button class="btn pri" data-act="exSave" ${dis}>Salvar execução</button></div>`}
function itemRow(o,i,dis){const s=svcOf(o,i.servicoId);return `<div class="itemrow row gap" style="margin-top:8px;align-items:flex-end"><label style="flex:1;min-width:220px;margin:0">Serviço<select class="it-svc" data-chg="itSvc" ${dis}>${svcOptions(o,i.servicoId)}</select></label><label style="width:110px;margin:0">Quantidade<input class="it-qtd" inputmode="decimal" value="${inp(i.qtd)}" ${dis}></label><span class="it-un small muted" style="width:46px;padding-bottom:10px">${s?esc(s.unidade):''}</span><span class="row" style="gap:4px;padding-bottom:4px"><button class="btn mini" data-act="useMed" data-k="a" title="usar área (m²)" ${dis}>= área</button><button class="btn mini" data-act="useMed" data-k="v" title="usar volume (m³)" ${dis}>= volume</button><button class="btn mini" data-act="useMed" data-k="c" title="usar comprimento (m)" ${dis}>= comp.</button><button class="btn mini dan" data-act="itemDel" ${dis}>✕</button></span></div>`}
function medidasVals(){const c=num($('#ex-mc').value),l=num($('#ex-ml').value),e=num($('#ex-me').value);return {c,l,e,a:r2(c*l),v:r2(c*l*e/100)}}
function modalPlan(oc){const o=O();const sel=oc.priG||oc.priF;return `<div class="mh"><h3>Planejar ocorrência #${oc.num}</h3><button class="x" data-act="mClose">×</button></div><div class="mb">
 <p><b>${esc(ocLocal(oc))}</b></p><p class="small">${esc(oc.desc)}</p><p class="small muted">Sugestão do fiscal: ${esc(oc.sug||'—')} · Prioridade sugerida: ${PRI[oc.priF].l}</p>${thumbsMini(oc.fotos)}
 <fieldset style="margin-top:12px"><legend>Decisão do gestor</legend><label>Prioridade<div class="row gap" style="margin-top:6px">${Object.entries(PRI).map(([k,v])=>`<label class="chk" style="margin:0"><input type="radio" name="pl-pri" value="${k}" ${sel===k?'checked':''}> <span class="chip" style="--c:${v.c}">${v.l}</span></label>`).join('')}</div></label>

 <div class="g2"><label>Serviço (item do contrato)<select id="pl-serv">${svcOptions(o,oc.servicoId||oc.servSug)}</select></label><label>Quantidade prevista<input id="pl-qtd" inputmode="decimal" value="${inp(oc.qtdPlan||oc.qtdFiscal)}">${oc.qtdFiscal?`<small class="muted">Fiscal mediu ${fN(oc.qtdFiscal)} no atendimento</small>`:''}</label></div>
 <label>Forma de solução / método a empregar<textarea id="pl-sol">${esc(oc.solucao||oc.sug||'')}</textarea></label><label>Observações do gestor<textarea id="pl-obs">${esc(oc.obsG||'')}</textarea></label></fieldset></div>
 <div class="mf"><button class="btn" data-act="mCancel">Cancelar</button><button class="btn pri" data-act="planSave">Salvar planejamento</button></div>`}
function modalObra(d,isNew){return `<div class="mh"><h3>${isNew?'Cadastrar obra (contrato)':'Dados da obra'}</h3><button class="x" data-act="mClose">×</button></div><div class="mb">

 <div class="g3"><label>Fiscal do contrato<input id="ob-fiscal" value="${esc(d.fiscal)}"></label><label>Gestor / Secretário<input id="ob-gestor" value="${esc(d.gestor)}"></label><label>Resp. técnico da contratada (CREA)<input id="ob-rt" value="${esc(d.rt)}"></label></div>

function cronoGrupos(o){const T=grpTodas(o.servicos.map(sv=>({grupo:sv.grupo||null,qtd:sv.qtd,pbdi:pbdi(o,sv)})));const gs=[];T.forEach(t=>{const k=t.grupo.c+'|'+t.grupo.d;let g=gs.find(x=>x.k===k);if(!g){g={k,c:t.grupo.c,d:t.grupo.d,valor:0};gs.push(g)}g.valor=r2(g.valor+r2(t.qtd*t.pbdi))});return gs}

 const realM=new Set(o.medicoes.map(m=>m.num).filter(n=>n>=1&&n<=N));const real={};gs.forEach(g=>real[g.k]=Array(N).fill(null));
 o.medicoes.forEach(m=>{if(m.num<1||m.num>N)return;grpTodas(m.todas||legacyTodas(m)).forEach(t=>{const k=t.grupo.c+'|'+t.grupo.d;if(real[k])real[k][m.num-1]=r2((real[k][m.num-1]||0)+t.valor)})});
 const pct={},vals={};
 gs.forEach(g=>{const saved=o.crono&&o.crono.pct&&o.crono.pct[g.k];const arr=Array(N).fill(0);const rp=real[g.k].reduce((s,v)=>s+(v||0),0)/(g.valor||1);
  const plan=[];for(let i=0;i<N;i++)if(!realM.has(i+1))plan.push(i);
  if(saved){plan.forEach(i=>arr[i]=+saved[i]||0)}else if(plan.length){const rest=Math.max(0,1-rp);const base=Math.trunc(rest/plan.length*10000)/10000;let acc=0;plan.forEach((i,j)=>{if(j<plan.length-1){arr[i]=base;acc+=base}else arr[i]=Math.max(0,Math.round((rest-acc)*10000)/10000)})}
  pct[g.k]=arr;const v=Array(N).fill(0);let lastP=-1;for(let i=0;i<N;i++){if(realM.has(i+1))v[i]=real[g.k][i]||0;else{v[i]=r2(g.valor*arr[i]);if(arr[i]>0)lastP=i}}
  const tot=r2(v.reduce((a,b)=>a+b,0));const sp=arr.reduce((a,b)=>a+b,0)+rp;if(lastP>=0&&Math.abs(sp-1)<0.005){v[lastP]=r2(v[lastP]+(g.valor-tot));g.adj=lastP}vals[g.k]=v});
 return {N,gs,real,pct,vals,realM}}

function cabDoc(o,titulo,sub){const c=S.settings.cab;return (o.demo?'<div class="demo">DOCUMENTO DE DEMONSTRAÇÃO — SEM VALOR LEGAL</div>':'')+`<div class="cab"><img src="${HEAD()}" style="height:64px"></div><h1>${esc(titulo)}</h1>${sub?`<div class="sub">${sub}</div>`:''}
 <table class="info"><tr><td>Obra</td><td colspan="3">${esc(o.nome)}</td></tr><tr><td>Contrato nº</td><td>${esc(o.contrato)}</td><td style="width:18%;background:#f4f4f4;font-weight:700">Processo</td><td>${esc(o.processo||'—')}</td></tr><tr><td>Contratada</td><td colspan="3">${esc(o.contratada)}${o.cnpj?' — CNPJ '+esc(o.cnpj):''}</td></tr><tr><td>Objeto</td><td colspan="3">${esc(o.objeto||'—')}</td></tr>${o.gestor||o.fiscal?`<tr><td>Gestor</td><td>${esc(o.gestor||'—')}</td><td style="background:#f4f4f4;font-weight:700">Fiscal técnico</td><td>${esc(o.fiscal||'—')}</td></tr>`:''}${o.fiscalAdm?`<tr><td>Fiscal adm.</td><td>${esc(o.fiscalAdm)}</td><td style="background:#f4f4f4;font-weight:700">Local</td><td>${esc(o.local||'—')}</td></tr>`:''}</table>`}

function htmlRDO(o,de,ate){const todos=diasComRegistro(o);const dias=todos.filter(d=>d>=de&&d<=ate);if(!dias.length)return null;

async function htmlFoto(o,de,ate){const exs=o.execucoes.filter(e=>e.data>=de&&e.data<=ate&&e.fotos.length);if(!exs.length)return null;const dias=[...new Set(exs.map(e=>e.data))].sort();let n=0,body='';
 for(const dia of dias){let blocos='';for(const e of exs.filter(x=>x.data===dia)){const L=localEx(o,e);const sv=e.itens.map(i=>{const s=svcOf(o,i.servicoId);return s?s.descricao:''}).filter(Boolean).join('; ');
  for(const f of e.fotos){n++;const src=await getFoto(f.id);const lat=f.lat!=null?f.lat:L.lat,lng=f.lng!=null?f.lng:L.lng;
   blocos+=`<div class="foto"><img src="${src||''}"><div class="cp"><b>Foto ${n}</b> — ${cap(f.fase||'depois')}${f.legenda?' — '+esc(f.legenda):''}<br>${esc(L.txt)}${L.oc?' (ocorrência nº '+L.oc.num+')':''}<br>${sv?esc(sv)+'<br>':''}${f.tiradaEm?'Registrada em '+fDH(f.tiradaEm):'Data do serviço: '+fData(e.data)}${lat!=null?' · Coord.: '+fN(lat,5)+', '+fN(lng,5):''}</div></div>`}}
  body+=`<section class="pg">${cabDoc(o,'RELATÓRIO FOTOGRÁFICO','Data: <b>'+fData(dia)+'</b> ('+diaSem(dia)+')')}<div class="fotos">${blocos}</div>${assinaturas(o)}</section>`}
