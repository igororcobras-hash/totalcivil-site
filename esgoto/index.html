<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<!-- Acesso: via carregador.js (login único do site), antes de entregar este HTML -->
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Esgoto Sanitário — Total Civil</title>
<style>
/* ── cores do site totalcivil.com.br ── */
:root{
  --bg:#f3f2ee; --ink:#14202e; --muted:#5a6573; --card:#ffffff; --line:#d9d6cc; --card2:#f7f6f2;
  --grid:rgba(20,32,46,.055); --accent:#c2410c; --accent-ink:#ffffff; --accent-soft:#fdeee5; --navy:#12263f;
  --ok-bg:#dcefe2; --ok-ink:#1b5e35; --warn-bg:#fdecd8; --warn-ink:#8a3a0a; --err:#b42318; --err-bg:#fde7e4; --field:#ffffff;
  --esg:#0f766e; --esg-soft:#d9f0ec; --tubo:#c98a2b; --terra:#8a6a4a;
  --shadow:0 1px 2px rgba(20,32,46,.06),0 8px 24px rgba(20,32,46,.06); --shadow-lg:0 20px 60px rgba(20,32,46,.22);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0f1620; --ink:#e8ecf1; --muted:#9aa6b5; --card:#17212e; --line:#263344; --card2:#131c28;
  --grid:rgba(232,236,241,.045); --accent:#fb923c; --accent-ink:#1a0f06; --accent-soft:#2b1d12; --navy:#e8ecf1;
  --ok-bg:#16382a; --ok-ink:#8fe0b0; --warn-bg:#3a2412; --warn-ink:#fbbf8a; --err:#f97066; --err-bg:#3a1512; --field:#101923;
  --esg:#2dd4bf; --esg-soft:#12332f; --tubo:#e0a548; --terra:#b08b63;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); --shadow-lg:0 20px 60px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background-color:var(--bg);color:var(--ink);line-height:1.45;font-size:15px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
h2{font-size:1.05rem;margin:0 0 10px;letter-spacing:.01em}
h3{font-size:.8rem;margin:14px 0 6px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
small,.mut{color:var(--muted)}

/* topo */
.top{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.top-l{display:flex;align-items:center;gap:10px;padding:8px 14px;flex-wrap:wrap}
.marca{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.marca-sq{width:32px;height:32px;border-radius:6px;background:var(--accent);display:grid;place-items:center;flex:none}
.marca-sq svg{width:19px;height:19px;stroke:var(--accent-ink);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.marca-nome{font-size:1.02rem;font-weight:800;letter-spacing:.14em;text-transform:uppercase;line-height:1}
.marca-nome span{color:var(--accent)}
.marca-prog{display:block;font-size:.64rem;letter-spacing:.16em;color:var(--muted);font-weight:700;margin-top:3px}
.pjn{flex:1;min-width:140px;max-width:420px;border:1px solid transparent;background:transparent;border-radius:8px;padding:6px 9px;font-weight:650}
.pjn:hover,.pjn:focus{border-color:var(--line);background:var(--field);outline:none}
.esp{flex:1}
.bt{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:600;font-size:.88rem;white-space:nowrap}
.bt:hover{border-color:var(--accent);color:var(--accent)}
.bt.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.bt.pri:hover{filter:brightness(1.07);color:var(--accent-ink)}
.bt.peq{padding:4px 9px;font-size:.78rem;border-radius:7px}
.bt.on{background:var(--navy);border-color:var(--navy);color:var(--card)}
.bt:disabled{opacity:.45;cursor:default}
.abas{display:flex;gap:2px;padding:0 10px;overflow-x:auto;scrollbar-width:thin}
.tab-btn{border:0;background:none;padding:9px 13px;cursor:pointer;font-weight:650;font-size:.88rem;color:var(--muted);border-bottom:3px solid transparent;white-space:nowrap;display:flex;gap:7px;align-items:center}
.tab-btn i{font-style:normal;display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--card2);border:1px solid var(--line);font-size:.7rem}
.tab-btn:hover{color:var(--ink)}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn.active i{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.status{display:flex;gap:6px;align-items:center;padding:6px 14px;flex-wrap:wrap;font-size:.8rem;border-top:1px solid var(--line);background:var(--card2)}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-weight:700;font-size:.74rem;background:var(--card);border:1px solid var(--line);cursor:default}
.chip.ok{background:var(--ok-bg);color:var(--ok-ink);border-color:transparent}
.chip.warn{background:var(--warn-bg);color:var(--warn-ink);border-color:transparent}
.chip.err{background:var(--err-bg);color:var(--err);border-color:transparent}
.chip.cl{cursor:pointer}

/* conteúdo */
main{padding:14px;max-width:1500px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.cols>.card{margin:0}
.fg{display:grid;gap:8px 12px;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));align-items:end}
.f label{display:block;font-size:.74rem;font-weight:650;color:var(--muted);margin-bottom:2px}
.f input,.f select,.inp{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--field)}
.f input:focus,.f select:focus,.inp:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:var(--accent)}
.f .aj{font-size:.7rem;color:var(--muted);margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.kpi{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.kpi b{display:block;font-size:1.12rem;font-variant-numeric:tabular-nums}
.kpi span{font-size:.7rem;color:var(--muted);font-weight:650;text-transform:uppercase;letter-spacing:.05em}
.barra{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.sep{width:1px;height:22px;background:var(--line);margin:0 3px}
.aviso{padding:9px 12px;border-radius:9px;background:var(--warn-bg);color:var(--warn-ink);font-size:.86rem;margin-bottom:10px}
.aviso.err{background:var(--err-bg);color:var(--err)} .aviso.ok{background:var(--ok-bg);color:var(--ok-ink)} .aviso.inf{background:var(--esg-soft);color:var(--esg)}

/* tabelas */
.tw{overflow:auto;border:1px solid var(--line);border-radius:10px;max-height:68vh}
table{border-collapse:collapse;width:100%;font-size:.8rem;font-variant-numeric:tabular-nums}
th{position:sticky;top:0;background:var(--navy);color:var(--card);font-weight:650;padding:6px 7px;text-align:right;white-space:nowrap;z-index:2;font-size:.72rem}
:root[data-theme="dark"] th{background:#22303f;color:var(--ink)}
th small{color:inherit;opacity:.7;font-weight:500;display:block}
td{padding:4px 7px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child,td.l,th.l{text-align:left}
tbody tr:hover{background:var(--accent-soft)}
tr.sel{outline:2px solid var(--accent);outline-offset:-2px}
tr.grp td{background:var(--card2);font-weight:700;text-align:left;text-transform:uppercase;font-size:.7rem;letter-spacing:.06em;color:var(--muted)}
td.e{color:var(--err);font-weight:700} td.w{color:var(--warn-ink);font-weight:700} td.o{color:var(--ok-ink)}
td select{min-width:82px}
td input,td select{width:100%;min-width:56px;padding:3px 5px;border:1px solid var(--line);border-radius:5px;background:var(--field);text-align:right}
td input.l{text-align:left;min-width:110px}
tfoot td{font-weight:800;background:var(--card2)}

/* traçado */
.tr-grid{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:12px}
.pl-box{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;height:calc(100vh - 210px);min-height:420px;box-shadow:var(--shadow)}
.pl-box svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
.pl-tools{position:absolute;top:8px;left:8px;right:8px;display:flex;gap:5px;flex-wrap:wrap;pointer-events:none}
.pl-tools>*{pointer-events:auto}
.pl-dica{position:absolute;left:64px;bottom:8px;right:8px;pointer-events:none;font-size:.78rem}
.pl-dica span{background:var(--navy);color:var(--card);padding:4px 10px;border-radius:8px;display:inline-block;opacity:.92}
.lado{display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 210px);overflow:auto}
.lado .card{margin:0;padding:12px}
.lista{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.lin{display:flex;gap:6px;align-items:center;padding:4px 6px;border-top:1px solid var(--line);font-size:.82rem}
.lin:first-child{border-top:0}
.lin input{flex:1;min-width:0;padding:3px 6px;border:1px solid var(--line);border-radius:5px;background:var(--field)}
.x{border:0;background:none;cursor:pointer;color:var(--muted);font-size:1rem;padding:0 4px}.x:hover{color:var(--err)}

/* 3D */
.t3{position:relative;height:calc(100vh - 190px);min-height:440px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#cfe3ee}
.t3 canvas{display:block;width:100%;height:100%}
.t3-bar{position:absolute;top:8px;left:8px;right:70px;display:flex;gap:5px;flex-wrap:wrap}
.t3-sl{position:absolute;right:10px;top:10px;bottom:10px;width:54px;background:rgba(18,38,63,.86);border-radius:12px;color:#fff;display:flex;flex-direction:column;align-items:center;padding:8px 0;gap:6px;font-size:.68rem;text-align:center}
.t3-sl input{writing-mode:vertical-lr;direction:rtl;flex:1;width:26px;accent-color:#fb923c}
.t3-sl b{font-size:.92rem}
.t3-inf{position:absolute;left:64px;bottom:8px;max-width:min(430px,calc(100% - 140px));background:rgba(255,255,255,.93);color:#14202e;border-radius:10px;padding:8px 11px;font-size:.8rem;box-shadow:var(--shadow)}
.t3-inf.al{border-left:5px solid #d97706}.t3-inf.er{border-left:5px solid #b42318}
.t3-lab{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.t3-lab div{position:absolute;transform:translate(-50%,-120%);background:rgba(18,38,63,.85);color:#fff;font-size:.68rem;padding:1px 6px;border-radius:5px;white-space:nowrap}

/* janelas */
.modal{position:fixed;inset:0;background:rgba(10,16,24,.5);z-index:200;display:flex;align-items:flex-start;justify-content:center;padding:5vh 12px;overflow:auto}
.mbox{background:var(--card);border-radius:14px;box-shadow:var(--shadow-lg);padding:18px;width:100%;max-width:640px;position:relative}
.mbox.g{max-width:900px}
.mx{position:absolute;top:8px;right:10px;border:0;background:none;font-size:1.3rem;cursor:pointer;color:var(--muted)}
textarea.inp{min-height:150px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--navy);color:var(--card);padding:9px 16px;border-radius:10px;box-shadow:var(--shadow-lg);z-index:400;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92vw;font-size:.88rem}
#toast.on{opacity:1}
.ini{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.ini button{text-align:left;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.ini button:hover{border-color:var(--accent);background:var(--accent-soft)}
.ini b{display:block;margin-bottom:3px}.ini span{font-size:.8rem;color:var(--muted)}
.amb{position:fixed;inset:0;z-index:300;background:linear-gradient(135deg,#12263f,#0f766e);display:flex;align-items:center;justify-content:center;padding:16px}
.amb .cx{background:var(--card);border-radius:16px;padding:26px;max-width:460px;width:100%;text-align:center;box-shadow:var(--shadow-lg)}
.amb button{display:block;width:100%;margin-top:9px;padding:13px;border-radius:10px;border:2px solid var(--line);background:var(--card);cursor:pointer;font-weight:650;text-align:left}
.amb button:hover{border-color:var(--accent)}
.memo{background:#fff;color:#111;padding:26px;border-radius:10px;border:1px solid var(--line);font-size:12.5px;line-height:1.5}
.memo h1{font-size:19px;margin:0 0 2px}.memo h2{font-size:14.5px;margin:18px 0 6px;border-bottom:2px solid #c2410c;padding-bottom:3px;color:#12263f}
.memo table{font-size:10.5px}.memo th{background:#12263f;color:#fff;position:static}.memo td{border:1px solid #ccc}.memo tbody tr:hover{background:none}
.memo .fx{font-family:Georgia,serif;font-style:italic;background:#f6f4ef;padding:5px 9px;border-left:3px solid #c2410c;margin:5px 0}
body.cel main{padding:8px}
body.cel .tx{display:none}
body.cel .pl-dica{display:none}
body.cel .status{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
body.cel .status .chip{flex:none}
body.cel .marca-nome{font-size:.86rem}
body.cel .t3,body.cel .pl-box{height:66vh}
@media (max-width:900px){.tr-grid{grid-template-columns:1fr}.pl-box{height:62vh}.lado{max-height:none}}
@media print{
  body{background:#fff}.top,.barra,#toast,.noprint{display:none!important}main{padding:0;max-width:none}
  .memo{border:0;padding:0}.card{border:0;box-shadow:none;padding:0}.memo table{page-break-inside:auto}.memo tr{page-break-inside:avoid}.memo h2{page-break-after:avoid}
  .memo svg{max-width:100%;height:auto}
}
</style>
<script src="/assistente-abas.js" data-tabs="#abas .tab-btn" data-auxilio="gerar" data-recolhido="1"></script>
<script src="/estado-pagina.js" data-abas="nao"></script>
<script src="/orcamento-comum.js"></script>

<div id="amb" class="amb" hidden><div class="cx">
  <div class="marca" style="justify-content:center;margin-bottom:10px"><span class="marca-sq"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 20V9l6-5 6 5v11M10 20v-6h4v6"/></svg></span><span class="marca-nome">Total <span>Civil</span></span></div>

</div></div>

    <a class="marca" href="/" title="Página inicial do Total Civil"><span class="marca-sq"><svg viewBox="0 0 24 24"><path d="M3 20h18M6 20V9l6-5 6 5v11M10 20v-6h4v6"/></svg></span>
      <span><span class="marca-nome">Total <span>Civil</span></span><span class="marca-prog">ESGOTO SANITÁRIO</span></span></a>

<script>
/* ════════════════════════════════════════════════════════════════════
   MOTOR DE CÁLCULO — ESGOTO SANITÁRIO (puro: não mexe na tela)
   Base: ABNT NBR 9649:1986 (redes coletoras) e NBR 14486:2000 (tubos de PVC).
   Unidades internas: m, m³/s, m/m, Pa. Vazões de entrada/saída em L/s.
   ════════════════════════════════════════════════════════════════════ */
const ESG = (() => {
  'use strict';
  const G = 9.80665, GAMA = 9806.65, YMAX = 0.938;          /* y/D da vazão máxima da seção circular */
  const SERIE = [100, 150, 200, 250, 300, 350, 400, 500, 600, 700, 800, 900, 1000];   /* DN (mm): até 400 PVC, acima concreto */
  const fl3 = x => Math.floor(x * 1000 + 1e-6) / 1000;
  const r3 = x => Math.round(x * 1000) / 1000;

  const CRIT0 = {
    modo: 'pop',            /* 'pop' = população distribuída pelo comprimento; 'taxa' = taxa linear informada */
    popI: 1800, popF: 2500, /* população de início e de fim de plano (hab) */
    qI: 150, qF: 150,       /* consumo de água per capita (L/hab·dia) */
    C: 0.80, K1: 1.20, K2: 1.50, K3: 0.50,
    txI: 1.5, txF: 2.5,     /* taxa linear de esgoto doméstico (L/s·km), só no modo 'taxa' */
    tInf: 0.10,             /* infiltração (L/s·km) — NBR 9649: 0,05 a 1,0 */
    qMin: 1.5,              /* vazão mínima de cálculo em qualquer trecho (L/s) */
    norma: '9649', n: 0.013, tau: 1.0,   /* '9649': n 0,013 e 1,0 Pa · '14486' (PVC): n 0,010 e 0,6 Pa */
    dMin: 150,              /* diâmetro mínimo (mm); a NBR 9649 admite DN 100 */
    yD: 0.75, yDvc: 0.50, vMax: 5.0,
    rec: 0.90, recPas: 0.65,/* recobrimento mínimo (m): leito da via · passeio (escolhido por trecho) */
    mat: 'pvcm',            /* tubo da rede até DN 400: pvcm (PVC parede maciça) · pvcc (PVC corrugado) · conc (concreto) */
    usaDI: true, diMan: {}, /* usar o diâmetro INTERNO real; diMan[mat][DN] = DI digitado (mm) */
    profMax: 4.5, degTQ: 0.50, distPV: 80, distMax: 100, profTL: 1.45,
    remanso: true,          /* nível d'água de saída do PV nunca acima do de chegada */
    folga: 0.60, berco: 0.10, envolt: 0.30, pav: 'asfalto', espPav: 0.05,
    largRua: 8, habLig: 3.0, ramal: 6, dmt: 5, empol: 1.30, folgaCava: 0.30, lastro: 0.10,
    /* elevatória e recalque (NBR 12208) */
    eCiclo: 10, eDet: 30, eEta: 0.60, eFolgaMotor: 20, eVmin: 0.60, eVmax: 3.00, eKloc: 10, eSub: 0.50, eRecRec: 1.00, eMat: 'pvc',
    /* sifão invertido */
    sVmin: 0.60, sDmin: 150, sLinhas: 2, sMat: 'fofo', sProt: 0.60,
    fator: 1                /* multiplicador da vazão de esgoto (cenários) */
  };
  const crit = P => Object.assign({}, CRIT0, (P && P.crit) || {});

  /* ── tubos: diâmetro externo (DE) e interno (DI) reais, mm ──
     PVC parede maciça NBR 7362: DE e espessura de catálogo de fabricante (DN 100 a 300); DN 350 e 400 aproximados.
     PVC corrugado: DI mínimo DN 100 = 100 mm (especificação de concessionária); demais aproximados — confira no catálogo. */
  const TUBOS = {
    pvcm: {nome: 'PVC parede maciça (NBR 7362)', DE: {100: 110, 125: 125, 150: 160, 200: 200, 250: 250, 300: 315, 350: 355, 400: 400}, e: {100: 2.5, 125: 2.8, 150: 3.6, 200: 4.5, 250: 6.1, 300: 7.2, 350: 8.7, 400: 9.8}, aprox: [350, 400]},
    pvcc: {nome: 'PVC corrugado dupla parede (NBR ISO 21138)', DE: {100: 110, 150: 160, 200: 200, 250: 250, 300: 315, 350: 355, 400: 400}, DI: {100: 100, 150: 145, 200: 182, 250: 228, 300: 285, 350: 327, 400: 375}, aprox: [150, 200, 250, 300, 350, 400]},
    conc: {nome: 'Concreto armado ponta e bolsa (NBR 8890)'}
  };
  function tuboGeo(D, c, matT) {
    const mat = D > 400 ? 'conc' : (matT || c.mat || 'pvcm'), T = TUBOS[mat] || TUBOS.pvcm, man = (c.diMan && c.diMan[mat]) || {};
    let de, di;
    if (mat === 'conc') { di = D; de = D + 2 * Math.round(D / 12 + 25); }
    else { de = T.DE[D] || D * 1.07; di = T.DI ? (T.DI[D] || D) : de - 2 * (T.e[D] || de * 0.03); }
    if (man[D] > 0) di = +man[D];
    if (!c.usaDI) di = D;
    const pvc = mat !== 'conc';

  /* ── cálculo completo da rede ── opt.fator: cenário de vazão · opt.fixo: {idTrecho:{D,ciM,ciJ}} (verifica sem redimensionar) */

  function idw(pts, x, y) {

        const den = dx1 * dy2 - dy1 * dx2, la = Math.hypot(dx1, dy1), lb = Math.hypot(dx2, dy2); if (Math.abs(den) < 1e-9 * la * lb || !la || !lb) continue;

    INF.forEach(inf => {

function dividirLongos() {

    for (let i = 1; i < k; i++) { const f = i / k, nv = {id: novoId('n'), x: ESG.r3(a.x + (b.x - a.x) * f), y: ESG.r3(a.y + (b.y - a.y) * f), ct: ESG.r3((+a.ct || 0) + ((+b.ct || 0) - (+a.ct || 0)) * f)}; P.nos.push(nv);

  if (e = q('[data-eeedel]')) return editar(() => { P.eee = P.eee.filter(x => x.id !== e.dataset.eeedel); });

  if (e = q('[data-pvlado]')) { PF.pvj = e.dataset.pvlado === 'j'; return render(); }

  if (e = q('[data-delp]')) { const id = e.dataset.delp; if (Object.keys(DB.list).length < 2) return toast('É o único projeto: crie outro antes de excluir.'); if (!confirm('Excluir “' + (DB.list[id].nome || '') + '” deste navegador?')) return; delete DB.list[id]; if (DB.cur === id) trocarProjeto(Object.keys(DB.list)[0]); else salvarJa(); return abrirProjetos(); }
  if (e = q('[data-nuvabrir]')) { const v = NUV.cache && NUV.cache[e.dataset.nuvabrir]; if (!v) return; try { const p = migrar(JSON.parse(v.dados)); p.nuvem = {id: e.dataset.nuvabrir}; novoProjeto(p); toast('Projeto aberto da nuvem.'); } catch (x) { toast('Projeto da nuvem ilegível.'); } return; }
  if (e = q('[data-nuvdel]')) { if (!confirm('Excluir este projeto da nuvem?')) return; return nuvIniciar().then(({d, fs}) => fs.deleteDoc(fs.doc(d, 'projetosEsgoto', e.dataset.nuvdel))).then(nuvListar).catch(x => toast('Não excluiu: ' + nuvErro(x))); }
  if ((e = q('tr[data-tr]')) && !q('input,select')) { SEL = {tipo: 'tr', id: e.dataset.tr}; return irAba('perfil'); }
  if ((e = q('#pf-box [data-tr]'))) { SEL = {tipo: 'tr', id: e.dataset.tr}; return render(); }
  if (t.id === 'b-undo') return desfazer(false); if (t.id === 'b-redo') return desfazer(true); if (t.id === 'b-proj') return abrirProjetos();
  if (t.id === 'b-amb') { CFG.amb = ''; return aplicarAmb(); }
  if (t.id === 'b-tema') { CFG.tema = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; lsSet(LS_CFG, CFG); aplicarTema(); return render(); }
});
document.addEventListener('change', ev => {
  const t = ev.target, d = t.dataset || {}, v = t.value;

  if (d.norma != null) return editar(() => { P.crit.norma = v; if (v === '9649') { P.crit.n = 0.013; P.crit.tau = 1.0; } if (v === '14486') { P.crit.n = 0.010; P.crit.tau = 0.6; } });
  if (d.sel) return editar(() => { P.crit[d.sel] = v; });
  if (d.chk) return editar(() => { P.crit[d.chk] = t.checked; });
  if (d.tfix) return editar(() => { const x = trDe(d.id); if (d.tfix === 'D') { if (v) x.Dfix = +v; else delete x.Dfix; } else { const i = num(v); if (i > 0) x.iFix = i / 100; else delete x.iFix; } P.manual = true; });
  if (d.tlad != null) return editar(() => { trDe(d.id).lados = +v; P.manual = true; });
  if (d.trk) return editar(() => { const x = trDe(d.id); if (v === '') delete x[d.trk]; else x[d.trk] = v; if (d.trk !== 'rua') P.manual = true; });
  if (d.sif) return editar(() => { const x = trDe(d.id); if (d.sif === 'on') { if (v === '1') x.sif = x.sif || {}; else delete x.sif; } else if (x.sif) { const k = num(v); if (isFinite(k)) x.sif[d.sif] = k; else delete x.sif[d.sif]; } P.manual = true; });
  if (d.eee) return editar(() => { const E = P.eee.find(x => x.id === d.id); if (!E) return; const k = d.eee;
    if (k === 'ate') { if (v === '@ext') { E.ext = E.ext || {nome: 'ponto de descarga', cota: ESG.r3((+noDe(E.no).ct || 0) + 3), L: 100}; delete E.ate; } else { E.ate = v; delete E.ext; } }
    else if (k === 'extCota' || k === 'extL') { const x = num(v); if (isFinite(x) && E.ext) E.ext[k === 'extCota' ? 'cota' : 'L'] = x; }
    else if (k === 'extNome') { if (E.ext) E.ext.nome = v.trim(); } else if (k === 'dnRec') { if (v) E.dnRec = +v; else delete E.dnRec; } else if (v === '') delete E[k]; else E[k] = v; });
  if (d.di) return editar(() => { const c = P.crit, m = c.mat || 'pvcm', x = num(v); c.diMan = JSON.parse(JSON.stringify(c.diMan || {})); c.diMan[m] = c.diMan[m] || {}; if (isFinite(x) && x > 20) c.diMan[m][d.di] = x; else delete c.diMan[m][d.di]; });
  if (d.no && d.k) return editar(() => { const n = noDe(d.no); if (d.k === 'nome') { n.nome = v.trim() || n.nome; } else { const x = num(v); if (d.k === 'ct') { if (isFinite(x)) n.ct = x; } else if (isFinite(x) && (x !== 0 || d.k === 'cfEx')) n[d.k] = x; else delete n[d.k]; } P.manual = true; });
  if (d.ruanome) return editar(() => { ruaDe(d.ruanome).nome = v.trim() || 'Rua'; });
  if (d.ruaz) return editar(() => { const [id, i] = d.ruaz.split(':'), x = num(v); ruaDe(id).pts[+i].z = isFinite(x) ? x : null; ruasMudaram(); });
  if (t.id === 'pf-col') { PF.col = +v; SEL = null; return render(); } if (t.id === 'pf-ate') { PF.ate = t.checked; return render(); } if (t.id === 'pf-ev') { PF.ev = +v; return render(); }
  if (d.orccod) return editar(() => { const o = orcCfg(), k = o.banco + '|' + d.orccod, e = Object.assign({}, o.it[k]); if (v.trim()) e.cod = v.trim(); else delete e.cod; o.it[k] = e; });
  if (d.orcpu) return editar(() => { const o = orcCfg(), k = o.banco + '|' + d.orcpu, x = num(v), e = Object.assign({}, o.it[k]); if (isFinite(x) && x >= 0) e.pu = x; else delete e.pu; o.it[k] = e; });
  if (t.id === 'orc-mes') { editar(() => { const o = orcCfg(); o.mes[o.banco] = v; }, true); return orcCarregar(); }
  if (t.id === 'orc-banco') return editar(() => { orcCfg().banco = v; });
  if (t.id === 'orc-deson') return editar(() => { orcCfg().deson = t.checked; });
  if (t.id === 'orc-bdi') return editar(() => { const x = num(v); orcCfg().bdi = isFinite(x) ? x : 0; });
  if (t.id === 'arq-json' && t.files[0]) { const fr = new FileReader(); fr.onload = () => { try { const p = migrar(JSON.parse(fr.result)); delete p.nuvem; novoProjeto(p); toast('Projeto aberto do arquivo.'); } catch (e) { toast('Arquivo inválido: escolha um .json salvo por este programa.'); } }; fr.readAsText(t.files[0]); }
});
document.addEventListener('input', ev => { if (ev.target.id === 't3-f' && T3.on) t3Cenario(+ev.target.value / 100); });
document.addEventListener('keydown', ev => {
  const emCampo = /INPUT|TEXTAREA|SELECT/.test(ev.target.tagName);
  if ((ev.ctrlKey || ev.metaKey) && !emCampo && ev.key.toLowerCase() === 'z') { ev.preventDefault(); return desfazer(ev.shiftKey); }
  if ((ev.ctrlKey || ev.metaKey) && !emCampo && ev.key.toLowerCase() === 'y') { ev.preventDefault(); return desfazer(true); }
  if (ev.key === 'Escape') { if (!$('modal').hidden) return fechar(); if (T3.voo) return t3Voo(false); if (PL.des.length) { PL.des = []; PL.cur = null; return plDesenhar(); } if (PL.modo !== 'sel' && TAB === 'tracado') { PL.modo = 'sel'; return render(); } }
  if (ev.key === 'Enter' && TAB === 'tracado' && PL.modo === 'rua' && PL.des.length > 1 && !emCampo) return plConcluirRua();

  if (ev.key === 'Delete' && !emCampo && TAB === 'tracado' && SEL) return excluir(SEL.tipo, SEL.id);
});
const naPlanta = ev => ev.target.closest && ev.target.closest('#pl-svg');
document.addEventListener('pointerdown', ev => { if (naPlanta(ev)) plDown(ev); });

carregar(); aplicarTema(); aplicarAmb(); desenharAbas(); recalc(); render();
