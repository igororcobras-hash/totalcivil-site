name: Publicar assistente de engenharia (gratuito)

# Cloudflare Workers (plano gratuito) + Gemini (API gratuita). Só roda à mão:
# Actions › "Publicar assistente de engenharia (gratuito)" › Run workflow.
# Segredos no GitHub: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID e GEMINI_API_KEY.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assistente:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Conferir segredos
        env:
          G: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do [ -n "${!v}" ] || { echo "Falta o segredo $v no GitHub."; exit 1; }; done
          [ -n "$G" ] || { echo "Falta o segredo GEMINI_API_KEY no GitHub."; exit 1; }
      - name: Juntar os especialistas
        run: node workers/assistente/montar-agentes.js
      - name: Contador de perguntas (KV)
        working-directory: workers/assistente
        run: |
          npm i -g wrangler@4 >/dev/null
          ID=$(wrangler kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{const a=JSON.parse(s.slice(s.indexOf('[')));const x=a.find(n=>/totalcivil-assistente-USO|^USO$/.test(n.title));console.log(x?x.id:'')}catch(e){console.log('')}})")
          if [ -z "$ID" ]; then wrangler kv namespace create USO; ID=$(wrangler kv namespace list | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const a=JSON.parse(s.slice(s.indexOf('[')));const x=a.find(n=>/USO/.test(n.title));console.log(x?x.id:'')})"); fi
          printf '\n[[kv_namespaces]]\nbinding = "USO"\nid = "%s"\n' "$ID" >> wrangler.toml
          cat wrangler.toml
      - name: Publicar o Worker
        working-directory: workers/assistente
        run: wrangler deploy 2>&1 | tee ../../deploy.log
      - name: Guardar a chave da Gemini no Cloudflare
        working-directory: workers/assistente
        env:
          G: ${{ secrets.GEMINI_API_KEY }}
        run: printf '%s' "$G" | wrangler secret put GEMINI_API_KEY
      - name: Ligar o endereço no botão do site
        run: |
          URL=$(grep -o 'https://[a-z0-9.-]*workers\.dev' deploy.log | head -1)
          [ -n "$URL" ] || { echo "Endereço do Worker não encontrado"; exit 1; }
          echo "Endereço: $URL"
          sleep 5; curl -s -X POST -H 'Content-Type: application/json' -d '{"ping":true}' "$URL"; echo
          sed -i "s#var URL_F = .*#var URL_F = window.TC_ASSIST_URL || '$URL';#" assistente.js
          if ! git diff --quiet assistente.js; then
            git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
            git add assistente.js && git commit -m "Assistente: endereço do Worker" && git push
          fi
