name: Publicar assistente de engenharia

# Publica a função "assistente" (pasta functions/) no Firebase calculadora-dnit.
# Só roda à mão: Actions › Publicar assistente de engenharia › Run workflow.
# Precisa: plano Blaze no Firebase; segredos FIREBASE_SERVICE_ACCOUNT (já existe) e ANTHROPIC_API_KEY.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assistente:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Copiar os especialistas para a função
        run: mkdir -p functions/agentes && cp .claude/agents/*.md functions/agentes/
      - name: Instalar dependências
        run: cd functions && npm install --no-package-lock && cd .. && npm install -g firebase-tools@14
      - name: Credenciais
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: printf '%s' "$SA" > "$RUNNER_TEMP/sa.json" && echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
      - name: Guardar a chave da API no Secret Manager
        env:
          CHAVE: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$CHAVE" ]; then echo "Falta o segredo ANTHROPIC_API_KEY no GitHub."; exit 1; fi
          printf '%s' "$CHAVE" > "$RUNNER_TEMP/k.txt"
          firebase functions:secrets:set ANTHROPIC_API_KEY --data-file "$RUNNER_TEMP/k.txt" --project calculadora-dnit --force --non-interactive
          rm -f "$RUNNER_TEMP/k.txt"
      - name: Publicar a função
        run: firebase deploy --only functions:assistente --project calculadora-dnit --force --non-interactive
      - name: Testar
        run: |
          curl -s -X POST -H 'Content-Type: application/json' -d '{"ping":true}' https://southamerica-east1-calculadora-dnit.cloudfunctions.net/assistente
