name: Bancos mensais SINAPI e SCO

# Baixa a SINAPI (Caixa, RJ) e o SCO (Prefeitura do Rio) de cada mês novo, confere,
# converte e grava em orcamento/dados/ (um arquivo por mês; os meses anteriores ficam).
# Se uma conferência falhar, o mês não é gravado e o GitHub manda e-mail com o motivo.
on:
  # Num PR que mexe na rotina: baixa e confere de verdade, mas não grava nada no site
  pull_request:
    paths:
      - 'scripts/bancos/**'
      - '.github/workflows/bancos-mensais.yml'
  schedule:
    - cron: '17 10 3-28 * *'   # todo dia, do dia 3 ao 28, às 07:17 de Brasília
  workflow_dispatch:
    inputs:
      fonte:
        description: 'sinapi, sco ou todas'
        default: 'todas'
      desde:
        description: 'Buscar também meses antigos que faltam, a partir de AAAA-MM (vazio = só os novos)'
        default: ''

permissions:
  contents: write

concurrency:
  group: bancos-mensais
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar leitores de planilha e PDF
        working-directory: scripts/bancos
        run: npm ci --no-audit --no-fund
      - name: Testar a conversão e as conferências
        working-directory: scripts/bancos
        run: node teste.mjs
      - name: Baixar, conferir e gravar os meses novos
        working-directory: scripts/bancos
        env:
          FONTE: ${{ github.event.inputs.fonte || 'todas' }}
          DESDE: ${{ github.event.inputs.desde || '' }}
        run: |
          set +e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            export BANCOS_PASTA_DADOS="$RUNNER_TEMP/dados"; cp -r ../../orcamento/dados "$BANCOS_PASTA_DADOS"
            echo "Teste do PR: nada é gravado no site."
          fi
          if [ -n "$DESDE" ]; then node atualizar.mjs --fonte "$FONTE" --desde "$DESDE"; else node atualizar.mjs --fonte "$FONTE"; fi
          echo "resultado=$?" >> "$GITHUB_ENV"
      - name: Publicar no site os meses gravados
        if: github.event_name != 'pull_request'
        run: |
          git add orcamento/dados
          if git diff --cached --quiet; then echo "Nenhum mês novo."; exit 0; fi
          meses=$(git diff --cached --name-only -- 'orcamento/dados/*/*.json.gz' | sed -E 's#orcamento/dados/([a-z]+)/([0-9]{4})-([0-9]{2}).*#\1 \3/\2#' | tr 'a-z' 'A-Z' | paste -sd ',' - | sed 's/,/, /g')
          git config user.name "Bancos mensais"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Bancos mensais: ${meses}"
          git push
      - name: Avisar se alguma fonte falhou
        if: env.resultado != '0'
        run: |
          echo "::error::Uma das fontes não foi gravada. O motivo está no resumo desta execução."
          exit 1
