<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="Do levantamento topográfico ao 3D: projeto automático da rede de drenagem pluvial em poucos cliques. Orçamento com EMOP, SINAPI e SCO-Rio.">

<meta property="og:description" content="Do levantamento topográfico ao 3D: projeto automático da rede em poucos cliques. Assista ao vídeo.">
<meta property="og:url" content="https://totalcivil.com.br/videos/drenagem/">
<meta property="og:image" content="https://totalcivil.com.br/videos/drenagem-capa.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="675">

<meta property="og:video:height" content="1080">

<meta name="theme-color" content="#0b1724">
<style>
:root{--accent:#22b8d6; --bg:#0b1724; --ink:#e8ecf1; --mut:#9fb0c2}
*{box-sizing:border-box}
html,body{margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
body{display:flex; flex-direction:column; min-height:100dvh}
header{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 16px; flex-wrap:wrap}
header a.marca{color:var(--ink); text-decoration:none; font-weight:800; line-height:1.1}
header a.marca small{display:block; font-weight:600; font-size:.72rem; letter-spacing:.08em; color:var(--accent)}
.acoes{display:flex; gap:8px; flex-wrap:wrap}
.bt{display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:10px; border:1.5px solid #2c4258; background:transparent; color:var(--ink);
  font:inherit; font-size:.92rem; font-weight:600; cursor:pointer; text-decoration:none}
.bt:hover,.bt:focus-visible{border-color:var(--accent); color:var(--accent)}
.bt.pri{background:var(--accent); border-color:var(--accent); color:#06212b}
.bt.pri:hover{filter:brightness(1.08); color:#06212b}
main{flex:1; display:flex; align-items:center; justify-content:center; padding:0 16px 12px}
.palco{position:relative; width:100%; max-width:min(1280px, calc((100dvh - 150px) * 16 / 9)); aspect-ratio:16/9; background:#000; border-radius:12px; overflow:hidden;
  box-shadow:0 10px 40px rgba(0,0,0,.45)}
video{display:block; width:100%; height:100%; background:#000}
.comp{position:absolute; top:12px; right:12px; z-index:2; display:inline-flex; align-items:center; gap:6px; padding:8px 14px 8px 10px; border:none; border-radius:999px;
  background:rgba(0,0,0,.6); color:#fff; font:inherit; font-weight:700; font-size:.95rem; cursor:pointer; backdrop-filter:blur(3px)}
.comp:hover,.comp:focus-visible{background:rgba(0,0,0,.82)}
@media (max-width:560px){ .comp{top:8px; right:8px; padding:7px} .comp span{display:none} }
#som{position:absolute; left:50%; bottom:64px; transform:translateX(-50%); display:none; padding:12px 20px; border-radius:999px; border:none;
  background:rgba(0,0,0,.72); color:#fff; font:inherit; font-weight:700; font-size:1rem; cursor:pointer; white-space:nowrap}
#som.vis{display:inline-flex; align-items:center; gap:8px}
#play{position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:rgba(0,0,0,.35); border:none; cursor:pointer; color:#fff; font:inherit}
#play.vis{display:flex}
#play span{display:flex; align-items:center; justify-content:center; width:88px; height:88px; border-radius:50%; background:var(--accent); color:#06212b; font-size:2.2rem; padding-left:6px}
footer{padding:6px 16px 14px; text-align:center; color:var(--mut); font-size:.85rem}
#aviso{position:fixed; left:50%; bottom:20px; transform:translateX(-50%); background:#12263f; border:1px solid var(--accent); color:#fff; padding:10px 16px;
  border-radius:10px; opacity:0; transition:opacity .2s; pointer-events:none}
#aviso.vis{opacity:1}
@media (max-width:560px){ header{padding:10px 12px} .bt{padding:7px 10px; font-size:.86rem} main{padding:0 0 10px} .palco{border-radius:0} }
</style>
</head>
<body>
<header>
  <a class="marca" href="/">Total Civil<small>DRENAGEM PLUVIAL</small></a>
  <div class="acoes">
    <a class="bt pri" href="/">Conhecer os programas →</a>
  </div>
</header>
<main>
  <div class="palco">
    <video id="v" src="/videos/drenagem-apresentacao.mp4" poster="/videos/drenagem-capa.jpg" controls playsinline autoplay preload="auto"></video>
    <button type="button" id="bt-comp" class="comp" aria-label="Compartilhar o vídeo" title="Compartilhar"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M14 5l7 7-7 7v-4.1c-5 0-8.5 1.6-11 5.1 1-5 4-10 11-11V5z"/></svg><span>Compartilhar</span></button>
    <button type="button" id="som">🔊 Toque para ativar o som</button>
    <button type="button" id="play" aria-label="Assistir ao vídeo"><span>▶</span></button>
  </div>
</main>
<footer>Do levantamento topográfico ao 3D: projeto automático da rede em poucos cliques · totalcivil.com.br</footer>
<div id="aviso" role="status"></div>
<script>
(function(){
  var v = document.getElementById('v'), som = document.getElementById('som'), play = document.getElementById('play');
  function mostra(el, s){ el.classList.toggle('vis', s); }
  /* Tenta tocar com som; se o navegador bloquear, toca sem som e mostra o botão de ativar o som.
     Se nem sem som deixar, mostra o botão grande de play. */
  function iniciar(){
    v.muted = false;
    v.play().then(function(){ mostra(som, false); mostra(play, false); }).catch(function(){
      v.muted = true;
      v.play().then(function(){ mostra(som, true); mostra(play, false); }).catch(function(){ mostra(play, true); });
    });
  }
  function ligarSom(){ v.muted = false; v.volume = 1; if(v.paused) v.play().catch(function(){}); mostra(som, false); }
  som.onclick = ligarSom;
  play.onclick = function(){ mostra(play, false); v.muted = false; v.play().catch(function(){}); };
  v.addEventListener('volumechange', function(){ if(!v.muted) mostra(som, false); });
  v.addEventListener('play', function(){ mostra(play, false); });
  /* No celular, tocar em qualquer lugar do vídeo também liga o som */
  v.addEventListener('click', function(){ if(v.muted){ ligarSom(); } });
  if(v.readyState >= 2) iniciar(); else v.addEventListener('loadeddata', iniciar, {once:true});

  var aviso = document.getElementById('aviso');
  function avisar(t){ aviso.textContent = t; mostra(aviso, true); setTimeout(function(){ mostra(aviso, false); }, 2500); }
  document.getElementById('bt-comp').onclick = function(){
    var url = 'https://totalcivil.com.br/videos/drenagem/';
    var dados = {title:'Drenagem Pluvial — Vídeo de Apresentação', text:'Veja o vídeo de apresentação do programa Drenagem Pluvial (Total Civil):', url:url};
    if(navigator.share){ navigator.share(dados).catch(function(){}); return; }
    if(navigator.clipboard){ navigator.clipboard.writeText(url).then(function(){ avisar('Link copiado!'); }, function(){ prompt('Copie o link:', url); }); }
    else prompt('Copie o link:', url);
  };
})();
</script>
</body>
</html>
